<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant GM</title>
<meta name="robots" content="noindex">
<style>
  /* Tokens: the dataviz reference palette (slots 1-3: blue, orange, aqua; validated
     all-pairs for colour-blind separation in both modes). Dark values are their own steps. */
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --grid: #e6e5e1; --blue: #2a78d6; --blue-soft: #86b6ef; --orange: #eb6834; --aqua: #1baf7a; --neutral: #a3a29d;
    --on-blue: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --card: #232321; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
      --grid: #383835; --blue: #3987e5; --blue-soft: #1c5cab; --orange: #d95926; --aqua: #199e70; --neutral: #6f6e69;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --card: #232321; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
    --grid: #383835; --blue: #3987e5; --blue-soft: #1c5cab; --orange: #d95926; --aqua: #199e70; --neutral: #6f6e69;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  body.card-mode main { max-width: 440px; padding: 14px 14px 16px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .sub, .note { color: var(--text-2); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hero .big { font-size: 48px; font-weight: 650; line-height: 1; }
  .facts { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; }
  .facts span:nth-child(odd) { color: var(--text-2); }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--text-2); font-size: 11px; }
  .tip { position: fixed; pointer-events: none; background: var(--card); color: var(--text); border: 1px solid var(--grid);
         border-radius: 8px; padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none;
         max-width: 260px; z-index: 5; }
  .tip b { display: block; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  /* the plan */
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--grid); }
  .plan li:first-child { border-top: 0; padding-top: 0; }
  .day { flex: none; min-width: 58px; font-size: 12px; font-weight: 600; text-align: center; border-radius: 6px;
         padding: 2px 6px; border: 1px solid var(--blue); color: var(--text); }
  .day.today { background: var(--blue); color: var(--on-blue); }
  .swap { font-weight: 600; }
  .changed { margin: 8px 0 0; padding: 6px 8px; border-left: 3px solid var(--orange); font-size: 13px; }
  .aside { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
  /* weeks */
  .weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .wk { border: 1px solid var(--grid); border-radius: 10px; padding: 8px; min-width: 0; }
  .wk.now { border-color: var(--blue); }
  .wk .v { font-size: 24px; font-weight: 650; line-height: 1.1; }
  .wk .l { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* grid */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -4px 0; padding: 0 4px; }
  table { border-collapse: collapse; font-size: 12px; }
  .grid th, .grid td { padding: 2px 1px; text-align: center; min-width: 30px; }
  .grid th.name, .grid td.name { text-align: left; white-space: nowrap; padding-right: 8px; position: sticky; left: 0;
                                  background: var(--card); min-width: 0; font-weight: 400; }
  .grid thead th { color: var(--text-2); font-weight: 400; }
  .grid .wkh { font-weight: 600; color: var(--text); }
  .grid .brk { border-left: 1px solid var(--muted); }
  .cell { width: 26px; height: 20px; border-radius: 4px; margin: 0 auto; font-size: 10px; line-height: 20px; }
  .cell.start { background: var(--blue); color: var(--on-blue); }
  .cell.bench { background: var(--orange); color: #0b0b0b; }
  .cell.s-start { border: 2px solid var(--blue); }
  .cell.s-bench { border: 2px solid var(--orange); }
  tr.sep td { border-top: 1px solid var(--grid); padding-top: 6px; }
  .grid th.today { color: var(--text); font-weight: 600; }
  .tabs { float: right; display: flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
  .tabs button { background: none; border: 0; color: var(--text-2); font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .tabs button.on { background: var(--blue); color: var(--on-blue); }
  .badge { font-size: 10px; font-weight: 600; color: var(--on-blue); background: var(--blue); border-radius: 4px;
           padding: 0 4px; margin-right: 5px; }
  tr.planrow .name { font-weight: 600; }
  .toggle { display: block; font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .dots { display: flex; gap: 2px; justify-content: center; align-items: center; height: 20px; }
  .dots.square { flex-wrap: wrap; width: 16px; margin: 0 auto; gap: 2px; align-content: center; }
  .dots i { display: block; flex: none; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; }
  .dots i.d-full { background: var(--blue); }
  .dots i.d-empty { border: 1px solid var(--muted); }
  .dots i.d-added { background: var(--aqua); }
  .dots i.d-freed { border: 2px solid var(--aqua); }
  .lost { color: var(--orange); font-weight: 600; }
  .open { font-weight: 600; }
  .zero { color: var(--muted); }
  /* move table */
  .moves { width: 100%; }
  .moves th { text-align: right; color: var(--text-2); font-weight: 400; padding: 4px 5px; border-bottom: 1px solid var(--grid);
              white-space: nowrap; cursor: pointer; }
  .moves th:first-child { text-align: left; }
  .moves td { padding: 5px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: right; white-space: nowrap; }
  .moves td:first-child { text-align: left; white-space: normal; min-width: 116px; }
  .moves th, .moves td { font-size: 12px; }
  .moves .why { color: var(--text-2); font-size: 11px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .more { margin-top: 8px; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
          font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .empty { color: var(--text-2); padding: 40px 0; text-align: center; }
  button.theme { float: right; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
                 font-size: 12px; padding: 3px 8px; cursor: pointer; }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading...</p></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
// The dashboard of the plan (bot/weekly.dashboard_data writes data.json from the Board).
// ?card renders the compact card the bot screenshots for Telegram (notify/snapshot.py).
const NS = "http://www.w3.org/2000/svg";
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const CARD = window.__CARD__ || new URLSearchParams(location.search).has("card");
let data = null, showAll = false, sortKey = "value";

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = p => `${Math.round(Math.min(Math.max(p, 0.01), 0.99) * 100)}%`;
const signed = (v, d = 1) => (v >= 0 ? "+" : "") + v.toFixed(d);
const wp = v => { const r = Math.round(100 * v); return (r > 0 ? "+" : "") + r; };  // win-pts, no "-0"
const width = () => Math.max(280, Math.min(app.clientWidth - 30, 728));
const pair = v => `${v[0].toFixed(0)}-${v[1].toFixed(0)}`;
function fmtDay(iso, opts = { weekday: "short", day: "numeric", month: "short" }) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", opts);
}
function showTip(evt, lines) {
  tip.replaceChildren();
  lines.forEach((line, i) => tip.append(el(i === 0 ? "b" : "div", {}, line)));
  tip.style.display = "block";
  const x = Math.min(evt.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${Math.max(8, x)}px`;
  tip.style.top = `${evt.clientY + 14}px`;
}
const hideTip = () => { tip.style.display = "none"; };
function hover(node, lines) {
  node.addEventListener("pointermove", e => showTip(e, lines));
  node.addEventListener("pointerleave", hideTip);
}
function key(token, label) {
  const s = el("span"); const i = el("i"); i.style.background = css(token); s.append(i, document.createTextNode(label)); return s;
}

// ---- header ---------------------------------------------------------------
function header() {
  const h = data.header;
  const box = el("section");
  if (!CARD) {
    const theme = el("button", { class: "theme", type: "button" }, "Theme");
    theme.onclick = () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
      render();
    };
    box.append(theme);
  }
  box.append(el("h1", {}, `Week ${data.week} vs ${data.opponent}`));
  const updated = new Date(data.generated);
  box.append(el("div", { class: "sub" }, `${fmtDay(data.days[0])} - ${fmtDay(data.days[1])} · updated ${updated.toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" })}`));
  const card = el("div", { class: "card" });
  const hero = el("div", { class: "hero" });
  const big = el("div");
  big.append(el("div", { class: "big num" }, pct(h.win)), el("div", { class: "sub" }, "chance to win this week"));
  const facts = el("div", { class: "facts num" });
  const rows = [];
  if (h.me.so_far || h.them.so_far) rows.push(["So far", pair([h.me.so_far, h.them.so_far])]);
  rows.push(["Projected", pair([h.me.expected, h.them.expected])]);
  if (h.yahoo_projected) rows.push(["Yahoo", pair(h.yahoo_projected)]);
  rows.push(["Adds left", `${h.adds_left.week} this week, ${h.adds_left.season} season`]);
  if (h.season) rows.push(["Season", `playoffs ${pct(h.season.playoffs)}, title ${pct(h.season.title)}`]);
  rows.forEach(([k, v]) => facts.append(el("span", {}, k), el("span", {}, v)));
  hero.append(big, facts);
  card.append(hero);
  box.append(card);
  return box;
}

// ---- the plan ---------------------------------------------------------------
function planCard() {
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "The plan"));
  if (!data.plan.length) card.append(el("div", {}, data.plan_empty));
  const list = el("ul", { class: "plan" });
  data.plan.forEach(p => {
    const li = el("li");
    li.append(el("span", { class: "day" + (p.today ? " today" : "") }, p.day));
    const body = el("div");
    body.append(el("div", { class: "swap" }, p.swap), el("div", { class: "note" }, p.detail));
    li.append(body);
    list.append(li);
  });
  card.append(list);
  if (data.changed) card.append(el("p", { class: "changed" }, `Changed since the last plan: ${data.changed}.`));
  if (data.this_week_line) card.append(el("p", { class: "aside" }, data.this_week_line));
  return card;
}

// ---- this week and the next two ----------------------------------------------
function weeksCard() {
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "This week and the next two"));
  const grid = el("div", { class: "weeks" });
  data.weeks.forEach((w, i) => {
    const t = el("div", { class: "wk" + (i === 0 ? " now" : "") });
    t.append(el("div", { class: "l" }, i === 0 ? `Week ${w.week}, now` : `Week ${w.week}`),
             el("div", { class: "v num" }, w.win == null ? "?" : pct(w.win)),
             el("div", { class: "l" }, w.opponent ? `vs ${w.opponent}` : "opponent not known"));
    if (w.margin != null) t.append(el("div", { class: "l num", title: "expected margin" }, `${signed(w.margin, 0)} pts`));
    grid.append(t);
  });
  card.append(grid);
  if (!CARD) card.append(el("div", { class: "note", style: "margin-top:8px" },
    "Later weeks are played against their real opponents: a point there counts by how close that week is."));
  return card;
}

// ---- the nights ahead: lineup games, you vs them ----------------------------------
function nightsCard() {
  const s = data.schedule;
  const today = data.date;
  const nights = s.days.map((d, i) => ({ ...d, mine: s.my_games[i], theirs: s.their_games[i] }))
    .filter(d => d.date >= today && d.week === data.week);
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "Lineup games left this week"));
  if (!nights.length) { card.append(el("div", { class: "note" }, "No games left this week.")); return card; }
  const W = width(), H = 150, m = { l: 26, r: 6, t: 16, b: 22 };
  const hi = Math.max(4, ...nights.map(n => Math.max(n.mine, n.theirs)));
  const band = (W - m.l - m.r) / nights.length, bw = Math.min(16, band * 0.32);
  const Y = v => m.t + (1 - v / hi) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Lineup games per night, you and them" });
  for (const t of [0, Math.round(hi / 2), hi]) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css("--grid") }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  }
  nights.forEach((n, i) => {
    const cx = m.l + band * (i + 0.5);
    [["mine", "--blue", -1], ["theirs", "--orange", 1]].forEach(([k, token, side]) => {
      const v = n[k], x = cx + side * (bw / 2 + 1) - bw / 2;
      const bar = svgEl("rect", { x, y: Y(v), width: bw, height: Math.max(0, Y(0) - Y(v)), rx: 3, fill: css(token) });
      hover(bar, [`${k === "mine" ? "You" : "Them"}: ${v} lineup games`, `${n.label} ${n.day}`]);
      svg.append(bar);
      if (CARD || nights.length <= 7) svg.append(svgEl("text", { x: x + bw / 2, y: Y(v) - 4, "text-anchor": "middle", fill: css("--text") }, v));
    });
    svg.append(svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle" }, n.date === today ? "Tonight" : `${n.label} ${n.day}`));
  });
  card.append(svg);
  const legend = el("div", { class: "legend" });
  const total = k => nights.reduce((a, n) => a + n[k], 0);
  legend.append(key("--blue", `You: ${total("mine")}`), key("--orange", `${data.opponent}: ${total("theirs")}`));
  card.append(legend);
  return card;
}

// ---- top moves: what each is worth ------------------------------------------------
const PARTS = [["now_wins", "--blue", "This week"], ["ahead", "--orange", "Weeks +1, +2"], ["later_wins", "--aqua", "Later"]];
const part = (r, k) => k === "ahead" ? (r.ahead_wins || []).reduce((a, b) => a + b, 0) : r[k];
function label(r) {
  const last = n => n.split(" ").slice(1).join(" ") || n;
  return r.drop ? `${last(r.add.name)} for ${last(r.drop.name)}` : r.ir_slot ? `${last(r.add.name)} (${r.ir_slot})` : `${last(r.add.name)} (open spot)`;
}
function valueCard() {
  const rows = [...data.moves].sort((a, b) => b.value - a.value).slice(0, 8);
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "Top moves: what each is worth"));
  card.append(el("div", { class: "note" }, "In win-pts: percentage points of a weekly win, summed over this week, the next two and later."));
  if (!rows.length) return card;
  const price = data.header.price ? data.header.price.lam : null;
  const W = width(), rowH = 26, m = { l: 132, r: 40, t: 18, b: 8 }, H = m.t + m.b + rowH * rows.length;
  const lo = Math.min(0, ...rows.map(r => PARTS.reduce((a, [k]) => a + Math.min(0, part(r, k)), 0)));
  const hi = Math.max(price || 0, ...rows.map(r => PARTS.reduce((a, [k]) => a + Math.max(0, part(r, k)), 0)));
  const X = v => m.l + (v - lo) / ((hi - lo) || 1) * (W - m.l - m.r);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Each move's value, by when it pays" });
  svg.append(svgEl("line", { x1: X(0), x2: X(0), y1: m.t - 4, y2: H - m.b, stroke: css("--muted") }));
  rows.forEach((r, i) => {
    const y = m.t + i * rowH + 4, h = rowH - 10;
    svg.append(svgEl("text", { x: m.l - 8, y: y + h - 3, "text-anchor": "end", fill: css(r.status === "plan" ? "--text" : "--text-2"),
                               "font-weight": r.status === "plan" ? 700 : 400 }, label(r)));
    let pos = 0, neg = 0;
    PARTS.forEach(([k, token, name]) => {
      const v = part(r, k);
      if (!v) return;
      const a = v > 0 ? pos : neg + v, b = v > 0 ? pos + v : neg;
      const seg = svgEl("rect", { x: X(a) + 1, y, width: Math.max(1, X(b) - X(a) - 2), height: h, rx: 2, fill: css(token) });
      hover(seg, [label(r), `${name}: ${wp(v)} win-pts`, `In all: ${wp(r.value)} win-pts`]);
      svg.append(seg);
      if (v > 0) pos += v; else neg += v;
    });
    svg.append(svgEl("text", { x: X(pos) + 6, y: y + h - 3, fill: css("--text") }, wp(r.value)));
  });
  if (price != null) {
    svg.append(svgEl("line", { x1: X(price), x2: X(price), y1: m.t - 4, y2: H - m.b, stroke: css("--text-2") }));
    svg.append(svgEl("text", { x: X(price), y: m.t - 8, "text-anchor": "middle" }, `an add costs ${Math.round(price * 100)}`));
  }
  card.append(svg);
  const legend = el("div", { class: "legend" });
  PARTS.forEach(([, token, name]) => legend.append(key(token, name)));
  legend.append(el("span", {}, "Bold: in the plan"));
  card.append(legend);
  return card;
}

// ---- schedule grid: by player, or by slot ------------------------------------------
let gridView = "player", gridPlan = true;
try { gridView = localStorage.getItem("gridView") || "player"; } catch (e) {}
function gridHead(s, table) {
  const thead = el("thead"), weeks = el("tr"), days = el("tr");
  weeks.append(el("th", { class: "name" }, ""));
  days.append(el("th", { class: "name" }, ""));
  let run = [];
  s.days.forEach(d => { if (!run.length || run.at(-1).week !== d.week) run.push({ week: d.week, n: 0 }); run.at(-1).n++; });
  run.forEach((r, k) => {
    const w = s.weeks[k] || { week: r.week, opponent: "" };
    weeks.append(el("th", { colspan: r.n, class: "wkh" + (k ? " brk" : "") }, `Week ${w.week} vs ${w.opponent}`));
  });
  s.days.forEach((d, i) => days.append(el("th", { class: (brk(s, i) ? "brk" : "") + (d.date === data.date ? " today" : "") },
                                          `${d.label} ${d.day}`)));
  thead.append(weeks, days);
  table.append(thead);
}
const brk = (s, i) => i > 0 && s.days[i].week !== s.days[i - 1].week;
function countRows(s, tbody, rows) {
  rows.forEach(([name, vals, cls], k) => {
    const tr = el("tr", { class: k === 0 ? "sep" : "" });
    tr.append(el("td", { class: "name" }, name));
    vals.forEach((v, i) => tr.append(el("td", { class: "num " + (brk(s, i) ? "brk " : "") + (cls ? cls(v) : "") },
                                         cls && !v ? "·" : v)));
    tbody.append(tr);
  });
}
function addRows(s, tbody, rows, plan) {
  rows.forEach((r, k) => {
    const tr = el("tr", { class: (k === 0 ? "sep" : "") + (plan ? " planrow" : "") });
    const name = el("td", { class: "name" });
    if (plan) name.append(el("span", { class: "badge" }, "Plan"));
    name.append(document.createTextNode(`+ ${r.name} ${r.positions}`));
    tr.append(name);
    r.cells.forEach((c, i) => {
      const td = el("td", { class: brk(s, i) ? "brk" : "" });
      if (c) {
        const box = el("div", { class: `cell s-${c}` });
        hover(box, [`${r.name} ${c === "start" ? "would start" : "would play, no slot free"}`,
                    plan ? `In the plan${r.drop ? ` for ${r.drop}` : ""}${r.when ? `, from ${fmtDay(r.when)}` : ""}`
                         : `Best streamer${r.drop ? ` for ${r.drop}` : ""}`]);
        td.append(box);
      }
      tr.append(td);
    });
    tbody.append(tr);
  });
}
function byPlayer(s, tbody) {
  s.rows.forEach(r => {
    const tr = el("tr");
    tr.append(el("td", { class: "name" }, `${r.name} ${r.positions}`));
    r.cells.forEach((c, i) => {
      const td = el("td", { class: brk(s, i) ? "brk" : "" });
      if (c) {
        const prob = r.probs[i];
        const box = el("div", { class: `cell ${c}` }, prob != null ? Math.round(prob * 100) : "");
        hover(box, [c === "start" ? "Starts" : "Plays, but no slot free", `${r.name}, ${s.days[i].label} ${s.days[i].day}`]
          .concat(prob != null ? [`${Math.round(prob * 100)}% chance to start`] : []));
        td.append(box);
      }
      tr.append(td);
    });
    tbody.append(tr);
  });
  addRows(s, tbody, s.plan || [], true);
  addRows(s, tbody, s.streamers || [], false);
  const positions = Object.keys(s.slots || (s.open[0] || {}));
  countRows(s, tbody, positions.map(p => [`Open ${p}`, s.open.map(o => o[p]), v => v ? "open" : "zero"])
    .concat([["Your lineup games", s.my_games], ["Their lineup games", s.their_games]]));
}
function bySlot(s, tbody) {
  const plan = gridPlan && s.with_plan ? s.with_plan : null;
  const open = plan ? plan.open : s.open;
  Object.entries(s.slots).forEach(([pos, cap]) => {
    const tr = el("tr");
    tr.append(el("td", { class: "name" }, `${pos} ×${cap}`));
    s.days.forEach((d, i) => {
      const td = el("td", { class: brk(s, i) ? "brk" : "" });
      const was = cap - s.open[i][pos], now = cap - open[i][pos];
      const dots = el("div", { class: "dots" + (cap > 3 ? " square" : "") });  // 4 D slots: 2 x 2
      for (let k = 0; k < cap; k++) {
        const kind = k < Math.min(was, now) ? "full" : k < now ? "added" : k < was ? "freed" : "empty";
        dots.append(el("i", { class: `d-${kind}` }));
      }
      hover(dots, [`${pos}, ${d.label} ${d.day}`, `${now} of ${cap} slots filled`]
        .concat(now > was ? [`${now - was} filled by the plan`] : now < was ? [`${was - now} freed by the plan`] : [])
        .concat(open[i][pos] ? [`${open[i][pos]} open: a streamer could play`] : []));
      td.append(dots);
      tr.append(td);
    });
    tbody.append(tr);
  });
  const benched = plan ? plan.benched : s.benched;
  countRows(s, tbody, [["Games lost (lineup full)", benched, v => v ? "lost" : "zero"],
                       ["Your lineup games", plan ? plan.my_games : s.my_games],
                       ["Their lineup games", s.their_games]]);
}
function grid() {
  const s = data.schedule;
  const card = el("section", { class: "card" });
  const tabs = el("div", { class: "tabs", role: "tablist" });
  [["player", "By player"], ["slot", "By slot"]].forEach(([v, name]) => {
    const b = el("button", { type: "button", role: "tab", "aria-selected": String(gridView === v), class: gridView === v ? "on" : "" }, name);
    b.onclick = () => { gridView = v; try { localStorage.setItem("gridView", v); } catch (e) {} render(); };
    tabs.append(b);
  });
  card.append(tabs, el("h2", {}, "Games by day"));
  card.append(el("div", { class: "note" }, gridView === "player"
    ? "Who starts, games lost to a full lineup, the plan's adds and the best streamer per position."
    : "Your lineup slots each night: open ones are where an add would play."));
  if (gridView === "slot" && s.with_plan) {
    const label = el("label", { class: "toggle" });
    const box = el("input", { type: "checkbox" });
    box.checked = gridPlan;
    box.onchange = () => { gridPlan = box.checked; render(); };
    label.append(box, document.createTextNode(" With the plan's moves"));
    card.append(label);
  }
  const table = el("table", { class: "grid" });
  gridHead(s, table);
  const tbody = el("tbody");
  (gridView === "slot" && s.slots ? bySlot : byPlayer)(s, tbody);
  table.append(tbody);
  const scroll = el("div", { class: "scroll" });
  scroll.append(table);
  card.append(scroll);
  const legend = el("div", { class: "legend" });
  const ring = (token, text, width = 2) => {
    const sp = el("span"); const i = el("i"); i.style.border = `${width}px solid ${css(token)}`; sp.append(i, document.createTextNode(text)); return sp;
  };
  if (gridView === "player") {
    legend.append(key("--blue", "Starts"), key("--orange", "Plays, no slot free"), ring("--blue", "An add would start"),
                  el("span", {}, "Goalie cells: % chance to start"));
  } else {
    legend.append(key("--blue", "Filled"), ring("--muted", "Open", 1));
    if (s.with_plan && gridPlan) legend.append(key("--aqua", "Filled by the plan"), ring("--aqua", "Freed by the plan"));
  }
  card.append(legend);
  return card;
}

// ---- every move weighed ---------------------------------------------------------
const COLUMNS = [["move", "Move"], ["when", "When"], ["now_wins", "Wk"], ["ahead", "+1/2"], ["later_wins", "Later"], ["value", "All"]];
function moveTable() {
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, `Every move weighed (${data.moves.length})`));
  const table = el("table", { class: "moves num" });
  const head = el("tr");
  COLUMNS.forEach(([k, name]) => {
    const th = el("th", {}, name + (sortKey === k ? " ▾" : ""));
    if (k !== "move" && k !== "when") th.onclick = () => { sortKey = k; render(); };
    head.append(th);
  });
  table.append(head);
  const rows = [...data.moves].sort((a, b) => part(b, sortKey) - part(a, sortKey));
  (showAll ? rows : rows.slice(0, 15)).forEach(r => {
    const tr = el("tr");
    const name = el("td");
    const dot = el("span", { class: "dot" });
    dot.style.background = r.status === "plan" ? css("--blue") : r.status === "passes" ? css("--neutral") : "transparent";
    dot.style.border = r.status === "fails" ? `1px solid ${css("--neutral")}` : "";
    const why = r.status === "plan" ? `in the plan (${r.why})` : r.why.replace(/^worth an add, but /, "");
    name.append(dot, document.createTextNode(label(r)), el("div", { class: "why" }, why));
    tr.append(name, el("td", {}, r.when ? fmtDay(r.when, { weekday: "short", day: "numeric" }) : ""));
    ["now_wins", "ahead", "later_wins", "value"].forEach(k => tr.append(el("td", {}, wp(part(r, k)))));
    table.append(tr);
  });
  const scroll = el("div", { class: "scroll" });
  scroll.append(table);
  card.append(scroll);
  if (rows.length > 15) {
    const more = el("button", { class: "more", type: "button" }, showAll ? "Show the top 15" : `Show all ${rows.length}`);
    more.onclick = () => { showAll = !showAll; render(); };
    card.append(more);
  }
  card.append(el("div", { class: "note", style: "margin-top:8px" },
    "Win-pts. Blue dot: in the plan. Grey: worth an add, but not in it. Ring: under the add's price. Tap a column to sort."));
  return card;
}

// ---- the add budget ---------------------------------------------------------------
function budgetCard() {
  const b = data.budget;
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, `Adds: ${b.used.at(-1) ?? 0} of ${b.cap} used`));
  const W = width(), H = 150, m = { l: 30, r: 8, t: 8, b: 22 };
  const n = b.pace.length, X = w => m.l + (w - 1) / (n - 1) * (W - m.l - m.r), Y = v => m.t + (1 - v / (b.cap + 2)) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Adds used against an even pace" });
  svg.append(svgEl("rect", { x: X(b.playoffs_from) - 4, y: m.t, width: W - m.r - X(b.playoffs_from) + 4, height: H - m.t - m.b, fill: css("--grid"), opacity: 0.6 }));
  svg.append(svgEl("text", { x: W - m.r - 2, y: H - m.b - 6, "text-anchor": "end" }, `playoffs: ${b.reserve} kept`));
  for (const t of [0, 10, 20, 30]) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css("--grid") }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  }
  [1, 5, 10, 15, 20, 25].filter(w => w <= n).forEach(w => svg.append(svgEl("text", { x: X(w), y: H - 6, "text-anchor": "middle" }, `Wk ${w}`)));
  svg.append(svgEl("polyline", { points: b.pace.map((v, i) => `${X(i + 1)},${Y(v)}`).join(" "), fill: "none", stroke: css("--muted"), "stroke-width": 2 }));
  if (b.used.length) {
    const steps = b.used.flatMap((v, i) => [`${X(i + 1)},${Y(i ? b.used[i - 1] : 0)}`, `${X(i + 1)},${Y(v)}`]);
    svg.append(svgEl("polyline", { points: steps.join(" "), fill: "none", stroke: css("--blue"), "stroke-width": 2 }));
  }
  card.append(svg);
  const legend = el("div", { class: "legend" });
  legend.append(key("--muted", "Even pace"), key("--blue", "Used"));
  card.append(legend);
  return card;
}

function render() {
  if (!data) return;
  if (CARD) {
    document.body.classList.add("card-mode");
    app.replaceChildren(header(), planCard(), weeksCard(), nightsCard());
  } else {
    app.replaceChildren(header(), planCard(), weeksCard(), nightsCard(), valueCard(), grid(), moveTable(), budgetCard());
  }
  document.body.dataset.ready = "1";  // notify/snapshot.py waits for this
}

try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
if (CARD) document.documentElement.dataset.theme = "light";
(window.__DATA__ ? Promise.resolve(window.__DATA__)
  : fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(d => { data = d; render(); })
  .catch(() => { app.replaceChildren(el("p", { class: "empty" }, "No plan yet: send /week to the bot.")); });
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
