<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Assistant GM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Assistant GM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens: the dataviz reference palette (slots 1-3: blue, orange, aqua; validated
     all-pairs for colour-blind separation in both modes). Dark values are their own steps. */
  /* Tokens: the night palette (the Telegram cards'); blue you, orange them, aqua the plan. */
  :root {
    color-scheme: dark;
    --surface: #0B1422; --card: #13213A; --text: #ffffff; --text-2: #B7C2D3; --muted: #6B7A90;
    --grid: #1E2E48; --blue: #4D9BF0; --blue-soft: #22508A; --orange: #F07A45; --aqua: #2CC28B; --neutral: #6B7A90;
    --on-blue: #0B1422; --orange-soft: #7A3A1E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text);
         font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  body.card-mode { background: #0B1422; }
  body.card-mode main { max-width: 390px; padding: 0; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .sub, .note { color: var(--text-2); font-size: 13px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hero .big { font-size: 48px; font-weight: 650; line-height: 1; }
  .facts { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; }
  .facts span:nth-child(odd) { color: var(--text-2); }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--text-2); font-size: 11px; }
  .tip { position: fixed; pointer-events: none; background: var(--card); color: var(--text); border: 1px solid var(--grid);
         border-radius: 8px; padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none;
         max-width: 260px; z-index: 5; }
  .tip b { display: block; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  /* the plan's notes */
  .changed { margin: 8px 0 0; padding: 8px 10px; background: #2A1E1A; border-radius: 10px; font-size: 13px; }
  .aside { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* grid */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -4px 0; padding: 0 4px; }
  table { border-collapse: collapse; font-size: 12px; }
  .grid th, .grid td { padding: 2px 1px; text-align: center; min-width: 30px; }
  .grid th.name, .grid td.name { text-align: left; white-space: nowrap; padding-right: 8px; position: sticky; left: 0;
                                  background: var(--card); min-width: 0; font-weight: 400; }
  .grid thead th { color: var(--text-2); font-weight: 400; }
  .grid .wkh { font-weight: 600; color: var(--text); }
  .grid .brk { border-left: 1px solid var(--muted); }
  .cell { width: 26px; height: 20px; border-radius: 4px; margin: 0 auto; font-size: 10px; line-height: 20px; }
  .cell.start { background: var(--blue); color: var(--on-blue); }
  .cell.bench { background: var(--orange); color: #0b0b0b; }
  .cell.s-start { border: 2px solid var(--blue); }
  .cell.s-bench { border: 2px solid var(--orange); }
  tr.sep td { border-top: 1px solid var(--grid); padding-top: 6px; }
  .grid th.today { color: var(--text); font-weight: 600; }
  .tabs { float: right; display: flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
  .tabs button { background: none; border: 0; color: var(--text-2); font-size: 12px; padding: 4px 10px; cursor: pointer;
                 white-space: nowrap; min-height: 30px; }
  main.nc .tabs { float: none; width: fit-content; flex: none; }
  .tabs button.on { background: var(--blue); color: var(--on-blue); }
  i.d-full { background: var(--blue); }
  i.d-empty { border: 1px solid var(--muted); }
  i.d-added { background: var(--aqua); }
  i.d-freed { border: 2px solid var(--aqua); }
  .lost { color: var(--orange); font-weight: 600; }
  .open { font-weight: 600; }
  .zero { color: var(--muted); }
  .tabs.tight button { padding: 4px 7px; }
  .cell.use { background: var(--blue); color: var(--on-blue); }
  .cell.full { color: var(--muted); }
  .cell.plain { border: 1px solid var(--grid); }
  .cell.sc { width: 32px; font-size: 9px; letter-spacing: -0.2px; }
  .grid td.sum { font-weight: 600; padding: 2px 4px; }
  .watch li { padding: 7px 0; border-top: 1px solid var(--grid); list-style: none; }
  .watch ul { margin: 0; padding: 0; }
  .watch summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; }
  .watch summary::-webkit-details-marker { display: none; }
  .watch summary h2 { margin: 0; }
  .watch summary::after { content: "\25B8"; margin-left: auto; color: var(--muted); }
  .watch[open] summary::after { content: "\25BE"; }
  .watch[open] summary { margin-bottom: 6px; }
  .watch .who { font-weight: 600; font-size: 14px; }
  /* move table */
  .moves { width: 100%; }
  .moves th { text-align: right; color: var(--text-2); font-weight: 400; padding: 4px 5px; border-bottom: 1px solid var(--grid);
              white-space: nowrap; cursor: pointer; }
  .moves th:first-child { text-align: left; }
  .moves td { padding: 5px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: right; white-space: nowrap; }
  .moves td:first-child { text-align: left; white-space: normal; min-width: 116px; }
  .moves th, .moves td { font-size: 12px; }
  .moves .why { color: var(--text-2); font-size: 11px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .more { margin-top: 8px; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
          font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .empty { color: var(--text-2); padding: 40px 0; text-align: center; }
  /* while data.json loads: the page's shape, pulsing (still, for anyone who asks for less motion) */
  .skeleton { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: 0 auto; padding: 16px 14px; }
  .skeleton i { display: block; height: 150px; border-radius: 16px; background: var(--card); animation: pulse 1.4s ease-in-out infinite; }
  .skeleton i:first-child { height: 140px; background: transparent; box-shadow: inset 0 0 0 14px var(--card); border-radius: 50%; width: 140px; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .skeleton i { animation: none; } }
  /* breakdowns: bars as HTML rows (tap a row for its sheet) */
  .bars { display: grid; grid-template-columns: minmax(96px, 38%) 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
  .bars .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars .lbl small { color: var(--text-2); margin-left: 4px; }
  .bars .val { text-align: right; white-space: nowrap; font-size: 12px; color: var(--text); }
  .bars .val small { color: var(--text-2); }
  .bars .row { display: contents; cursor: pointer; }
  .bars .row.muted .lbl, .bars .row.muted .val { color: var(--muted); }
  .bars .total { font-weight: 600; }
  .bars .lbl.total { grid-column: span 2; }
  .bars .rule { grid-column: 1 / -1; border-top: 1px solid var(--grid); }
  .track { position: relative; height: 14px; }
  .track.pair { height: 22px; }
  .seg { position: absolute; border-radius: 3px; }
  .seg.ghost { background: transparent !important; border: 1.5px dashed; }
  .zline { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .pricemark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }
  .stack { display: flex; height: 22px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .stack div { height: 100%; }
  .scoreline { display: grid; grid-template-columns: 64px 1fr auto; gap: 6px 8px; align-items: center; font-size: 13px; }
  /* sheets: a player's or a move's numbers */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 8; display: flex; align-items: flex-end;
              justify-content: center; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto;
           border-radius: 14px 14px 0 0; padding: 16px 16px 28px; box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
  .sheet h3 { margin: 14px 0 6px; font-size: 14px; }
  .sheet .close { float: right; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
                  font-size: 13px; padding: 3px 10px; cursor: pointer; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-left: 6px;
          border: 1px solid var(--grid); color: var(--text-2); vertical-align: 2px; }
  .chip.plan { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .kv { width: 100%; font-size: 13px; }
  .kv td, .kv th { padding: 4px 6px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  .kv td:first-child, .kv th:first-child { text-align: left; white-space: normal; }
  .kv th { color: var(--text-2); font-weight: 400; }
  .kv tr.sum td { font-weight: 650; border-bottom: 0; }
  .linkish { background: none; border: 1px solid var(--grid); color: var(--text); border-radius: 6px; font-size: 12px;
             padding: 3px 9px; cursor: pointer; margin: 6px 6px 0 0; }
  .tap { cursor: pointer; }
  .flags { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-2); }
  /* the dashboard (tabs) */
  main.nc { max-width: 760px; margin: 0 auto; padding: 16px 14px 96px; gap: 12px; }
  main.nc .card { margin-top: 0; }
  main.nc h2 { font-size: 17px; margin: 0; }
  .wrap { white-space: normal !important; }
  .nc-tile.now { background: #182A47; border: 1.5px solid var(--blue); }
  .nc-tile.tap { cursor: pointer; }
  button.nc-row, button.prow, button.mrow { width: 100%; background: none; border: 0; color: inherit; font: inherit;
                                            text-align: left; cursor: pointer; }
  .fresh { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 4px 10px;
           font-size: 12px; color: #DCE3EE; white-space: nowrap; }
  .fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--aqua); }
  .fresh.stale i { background: var(--orange); }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; justify-content: center;
            background: var(--card); border-top: 1px solid var(--grid); padding: 0 6px env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; max-width: 140px; background: none; border: 0; color: var(--text-2); cursor: pointer;
                   font: 600 11px Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;
                   gap: 3px; padding: 8px 0; min-height: 54px; }
  .tabbar button.on { color: #7DB8FF; }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round;
                stroke-linejoin: round; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .prow.muted { opacity: .6; }
  .pmid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .pname { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pname small { color: var(--text-2); font-weight: 400; font-size: 12px; margin-left: 5px; }
  .pline { display: flex; align-items: center; gap: 8px; }
  .pbar { flex: 1; display: flex; gap: 2px; height: 7px; background: var(--surface); border-radius: 3px; overflow: hidden; }
  .pbar i { height: 7px; border-radius: 3px; }
  .pdots { display: flex; gap: 4px; min-width: 56px; justify-content: flex-end; }
  .sdot { display: block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; flex: none; }
  .legend .sdot { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
  .fly { display: grid; grid-template-columns: 36px 1fr 92px 1fr 36px; gap: 6px; align-items: center; font-size: 13px; margin-top: 8px; }
  .fly > span { text-align: center; }
  .fly .l, .fly .r { display: flex; height: 12px; }
  .fly .l { justify-content: flex-end; }
  .fly i { display: block; height: 12px; border-radius: 3px; }
  .fly .me { text-align: right; color: #7DB8FF; }
  .fly .them { color: #FFA57D; }
  .mrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .mname { flex: 1; min-width: 0; font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mname.on { color: #fff; font-weight: 700; }
  .nc-val.dim { color: var(--text-2); }
  .mbar { position: relative; display: flex; gap: 2px; height: 10px; }
  .mbar i { display: block; height: 10px; border-radius: 2px; }
  .mbar b { position: absolute; top: -3px; width: 2px; height: 16px; background: #fff; }
  .tokens { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
  .tokens i { aspect-ratio: 1; border-radius: 4px; box-sizing: border-box; }
  .legend i.tok { width: 11px; height: 11px; border-radius: 3px; box-sizing: border-box; }
  .t-used { background: var(--blue); } .t-open { border: 1.5px solid var(--muted); } .t-kept { background: #5A3A2A; }
  .weekpick { display: flex; gap: 6px; }
  .weekpick button { flex: 1; min-width: 0; background: var(--card); color: var(--text-2); border: 1.5px solid transparent;
                     border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; font: 500 12px Inter, system-ui, sans-serif;
                     display: flex; flex-direction: column; gap: 2px; }
  .weekpick button.on { border-color: var(--blue); color: #fff; }
  .weekpick b { font-size: 16px; color: #fff; }
  .weekpick b span { color: #7DB8FF; }
  .weekpick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sgrid, .stgrid { display: grid; align-items: center; margin-top: 8px; min-width: 320px; }
  .stgrid { gap: 3px; }
  .sday { text-align: center; font-size: 12px; line-height: 1.25; color: var(--text-2); padding: 3px 0; border-radius: 6px 6px 0 0; }
  .sday.today { color: #fff; font-weight: 700; background: rgba(77, 155, 240, .12); }
  .sday.off { background: #1E3A5F; color: #fff; }
  .sgroup { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: .04em;
            padding: 8px 0 2px; border-top: 1px solid var(--grid); }
  .swho { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; padding: 4px 0; }
  .swho b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .swho small { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .swho.add b, .swho.add small { color: var(--aqua); }
  .swho.drop b { color: var(--text-2); } .swho.drop small { color: #FFA57D; }
  .swho.sum { font-size: 12px; color: var(--text-2); }
  .swho.me, .snum.me { color: #7DB8FF; } .swho.them, .snum.them { color: #FFA57D; } .swho.lost, .snum.lost { color: var(--orange); }
  .scell { display: flex; justify-content: center; align-items: center; height: 32px; }
  .scell.slots { gap: 2px; flex-wrap: wrap; align-content: center; padding: 0 2px; }
  .scell.slots.sq { width: 18px; margin: 0 auto; }
  .scell.slots i { display: block; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; }
  .snum { text-align: center; font-size: 13px; font-weight: 700; }
  .snum.zero { color: var(--muted); font-weight: 400; }
  .tbadge { width: 34px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
            color: #fff; font: 700 11px "Barlow Condensed", system-ui, sans-serif; }
  .tbadge.logo { background: transparent !important; }
  .tbadge img { width: 30px; height: 26px; object-fit: contain; }
  .scell2 { height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font: 600 11px "Barlow Condensed", system-ui, sans-serif; box-sizing: border-box; }
  .scell2.plain { background: var(--surface); border: 1px solid #2A3A55; }
  .scell2.off { background: #1E3A5F; }
  .scell2.offbg { background: #13263F; }
  .scell2.use { background: var(--blue); color: var(--on-blue); }
  /* the Telegram card (?card): night style, read at about 80% on a phone, so no text under 13px */
  .nc { background: #0B1422; color: #fff; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .nc .cond { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 700; }
  .nc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .nc-week { font-size: 20px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc-week span { color: #B7C2D3; font-weight: 500; }
  .nc-dim { color: #B7C2D3; font-size: 13px; white-space: nowrap; }
  .nc-hero { display: flex; align-items: center; gap: 16px; }
  .nc-ring { position: relative; width: 140px; height: 140px; flex: none; }
  .nc-ring svg { width: 140px; }
  .nc-ring div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .nc-big { font-size: 46px; line-height: 1; }
  .nc-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .nc-team { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; }
  .nc-score { font-size: 26px; line-height: 1; white-space: nowrap; }
  .nc-score small { font-size: 16px; color: #B7C2D3; font-weight: 500; }
  .nc-bar { display: flex; height: 10px; gap: 2px; margin-top: 5px; }
  .nc-bar i { border-radius: 3px; }
  .nc-tile { background: #13213A; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .nc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .nc-today { font-size: 15px; letter-spacing: .08em; color: #2CC28B; }
  .nc-val { font-size: 28px; line-height: 1; color: #2CC28B; }
  .nc-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nc-who b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc-who span { font-size: 13px; color: #B7C2D3; }
  .nc-who.drop { text-align: right; }
  .nc-who.drop b { color: #B7C2D3; }
  .nc-detail { font-size: 14px; color: #DCE3EE; }
  .nc-next .nc-row { padding: 8px 2px; border-bottom: 1px solid #1E2E48; }
  .nc-next .nc-row:last-child { border-bottom: 0; }
  .nc-day { font-size: 15px; color: #7DB8FF; width: 58px; flex: none; }
  .nc-swap { flex: 1; min-width: 0; font-size: 15px; }
  .nc-next .nc-val { font-size: 20px; }
  .nc .plus { color: #2CC28B; font-weight: 700; }
  .nc .minus { color: #F07A45; font-weight: 700; }
  .nc-weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .nc-wk { background: #13213A; border-radius: 10px; padding: 8px 10px; border: 1.5px solid transparent; min-width: 0; }
  .nc-wk.now { border-color: #4D9BF0; }
  .nc-wk span { display: block; font-size: 13px; color: #B7C2D3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc-wk b { display: block; font-size: 24px; line-height: 1.1; }
  .nc svg.big-text text { fill: #B7C2D3; font-size: 13px; }
  .nc-table { display: grid; grid-template-columns: 1fr 70px 70px; gap: 4px 8px; align-items: baseline;
              border-top: 1px solid #1E2E48; padding-top: 10px; font-size: 14px; }
  .nc-table > :nth-child(3n+2), .nc-table > :nth-child(3n) { text-align: right; }
  .nc-table b { font-size: 22px; }
  .nc-dots { display: grid; gap: 8px; align-items: center; }
  .nc-dotrow { display: flex; gap: 5px; flex-wrap: wrap; }
  .nc-dot { display: block; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
  .nc-parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13px; color: #B7C2D3; }

<body>
<main id="app" aria-busy="true"><div class="skeleton"><i></i><i></i><i></i></div></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
// The dashboard of the plan (bot/weekly.dashboard_data writes data.json from the Board).
// ?card renders the compact card the bot screenshots for Telegram (notify/snapshot.py).
const NS = "http://www.w3.org/2000/svg";
const app = document.getElementById("app");
const tip = document.getElementById("tip");
// ?card: the plan's card; ?card=move&key=K: a move's; ?card=result: Monday's result (window.__CARD__ in a screenshot).
const PARAMS = new URLSearchParams(location.search);
const CARD = window.__CARD__ ? (window.__CARD__ === true ? "plan" : window.__CARD__)
                             : PARAMS.has("card") ? PARAMS.get("card") || "plan" : null;
const CARD_KEY = window.__CARD_KEY__ || PARAMS.get("key");
let data = null, showAll = false, sortKey = "value";

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);

  return e;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = p => `${Math.round(Math.min(Math.max(p, 0.01), 0.99) * 100)}%`;
const signed = (v, d = 1) => { const t = Math.abs(v).toFixed(d); return (v < 0 && +t ? "-" : "+") + t; };  // no "-0.0"
const wp = v => { const r = Math.round(100 * v); return (r > 0 ? "+" : "") + r; };  // win-pts, no "-0"
const width = () => Math.max(280, Math.min(app.clientWidth - 30, 728));
const pair = v => `${v[0].toFixed(0)}-${v[1].toFixed(0)}`;
function fmtDay(iso, opts = { weekday: "short", day: "numeric", month: "short" }) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", opts);
}
let tipAt = 0;  // where the page was scrolled when the number was shown
function showTip(evt, lines) {
  tip.replaceChildren();
  lines.forEach((line, i) => tip.append(el(i === 0 ? "b" : "div", {}, line)));
  tip.style.display = "block";
  tipAt = scrollY;
  const x = Math.min(evt.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${Math.max(8, x)}px`;
  tip.style.top = `${Math.max(8, Math.min(evt.clientY + 14, window.innerHeight - tip.offsetHeight - 70))}px`;  // above the tab bar
}
const hideTip = () => { tip.style.display = "none"; };
// A number behind a mark: shown under the mouse, and pinned by a tap (a phone has no hover);
// a tap anywhere else, or a scroll, takes it away.
function hover(node, lines) {
  node.addEventListener("pointermove", e => { if (e.pointerType === "mouse") showTip(e, lines); });
  node.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
  node.addEventListener("click", e => { e.stopPropagation(); showTip(e, typeof lines === "function" ? lines(e) : lines); });
}
addEventListener("click", hideTip);
addEventListener("scroll", () => { if (Math.abs(scrollY - tipAt) > 40) hideTip(); }, { passive: true });  // a real scroll, not a nudge
function key(token, label) {
  const s = el("span"); const i = el("i"); i.style.background = css(token); s.append(i, document.createTextNode(label)); return s;
}

// ---- the dashboard: five tabs in a bar at the bottom, each a few cards; a sheet per player and per move ----
const TABS = [["today", "Today"], ["matchup", "Matchup"], ["moves", "Moves"], ["schedule", "Schedule"], ["watch", "Watch"]];
const TAB_ICONS = {
  today: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  matchup: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  moves: '<path d="M4 8h14m-4-4 4 4-4 4M20 16H6m4-4-4 4 4 4"/>',
  schedule: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  watch: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>' };
const hashTab = () => (location.hash.match(/^#(today|matchup|moves|schedule|watch)$/) || [])[1];
let tab = hashTab() || recall("tab", "today");
function pickTab(v) {
  tab = v;
  remember("tab", v);
  history.replaceState(null, "", `#${v}`);
  render();
  scrollTo(0, 0);
}
function tabBar() {
  const nav = el("nav", { class: "tabbar", "aria-label": "Dashboard" });
  TABS.forEach(([v, name]) => {
    const b = el("button", { type: "button", class: v === tab ? "on" : "" });
    if (v === tab) b.setAttribute("aria-current", "page");
    const icon = document.createElementNS(NS, "svg");
    icon.setAttribute("viewBox", "0 0 24 24");
    icon.setAttribute("aria-hidden", "true");
    icon.innerHTML = TAB_ICONS[v];  // a fixed icon, not data
    b.append(icon, document.createTextNode(name));

}
// How fresh the plan is: the run's time; orange once it's over 2 hours old.
function freshness() {
  const at = new Date(data.generated), mins = Math.round((Date.now() - at) / 60000);
  const pill = el("span", { class: "fresh" + (mins > 120 ? " stale" : "") });
  pill.append(el("i"), document.createTextNode(mins < 60 ? `${Math.max(mins, 0)} min ago`
    : at.toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" })));
  pill.title = "When the plan was last run";
  return pill;
}

// ---- Today: the odds and the score, the plan, the race, why the win %, the nights, the weeks ahead ----
function todayTop() {
  const h = data.header, box = el("section", { class: "top" }), row = el("div", { class: "nc-top" });
  const title = el("span", { class: "nc-week cond" }, `WEEK ${data.week} `);
  title.append(el("span", {}, `vs ${data.opponent}`));
  row.append(title, freshness());
  const hero = el("div", { class: "nc-hero" });
  hero.append(ring(h.win), scoreBars(h));
  const facts = [];
  if (h.yahoo_projected) facts.push(`Yahoo ${pair(h.yahoo_projected)}`);
  facts.push(`adds ${h.adds_left.week} this week, ${h.adds_left.season} season`);
  if (h.season) facts.push(`playoffs ${pct(h.season.playoffs)}, title ${pct(h.season.title)}`);
  box.append(row, hero, el("div", { class: "nc-dim wrap" }, facts.join(" · ")));
  return box;
}
// The plan's later moves as rows (day, + add − drop, value); `tap`: each opens its sheet.
function planRows(rows, tap) {
  const next = el("div", { class: "nc-next" });
  rows.forEach(p => {
    const r = p.key ? data.moves.find(m => m.key === p.key) : null, link = tap && r;
    const row = el(link ? "button" : "div", { class: "nc-row" + (link ? " tap" : "") });
    if (link) { row.type = "button"; row.onclick = () => openSheet("move", r.key); }
    row.append(el("span", { class: "nc-day cond" }, p.today ? "TODAY" : dayShort(p.day)), swapSpan(r, p.swap));
    if (r) row.append(el("span", { class: "nc-val cond num" }, wp(r.value)));
    next.append(row);
  });
  return next;
}
function weekTiles() {
  const weeks = el("div", { class: "nc-weeks" });
  data.weeks.forEach((w, i) => {
    const t = el("div", { class: "nc-wk" + (i === 0 ? " now" : "") });
    t.append(el("span", {}, i === 0 ? `Wk ${w.week} · now` : `Wk ${w.week}`),
             el("b", { class: "cond num" }, w.win == null ? "?" : pct(w.win)),
             el("span", {}, (w.opponent ? shortTeam(w.opponent) : "not known") + (w.margin != null ? ` · ${signed(w.margin, 0)}` : "")));
    weeks.append(t);

}
function planSection() {
  const card = el("section", { class: "card" }), head = el("div", { class: "nc-row" });
  head.append(el("h2", {}, "The plan"));
  if (data.header.price) head.append(el("span", { class: "nc-dim" }, `an add costs ${Math.round(100 * data.header.price.lam)}`));
  card.append(head);
  const today = data.plan.filter(p => p.today), later = data.plan.filter(p => !p.today);

// Each team's points through the week: banked day by day (solid), then expected (dashed).
function raceCard() {
  const h = data.header, race = data.race, start = new Date(data.days[0] + "T12:00:00");
  const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d.toLocaleDateString("sv-SE"); });
  const done = days.filter(d => d < data.date).length;
  const series = side => {
    const t = h[side], exp = t.by_day || {}, out = [0];
    days.forEach((d, i) => {
      const banked = race ? (race[side][race.days.indexOf(d)] || 0) : t.so_far / Math.max(done, 1);  // no race: spread evenly
      out.push(out.at(-1) + (d < data.date ? banked : exp[d] || 0));

  };

  card.append(el("h2", {}, "The race so far, and where it's heading"));
  const W = width(), H = 170, m = { l: 10, r: 36, t: 12, b: 24 };
  const X = i => m.l + i * (W - m.l - m.r) / 7, Y = v => m.t + (1 - v / hi) * (H - m.t - m.b);

                             "aria-label": `Score so far ${f0(A[done])} to ${f0(B[done])}, expected ${f0(A[7])} to ${f0(B[7])}` });
  svg.append(svgEl("rect", { x: X(done), y: m.t, width: X(7) - X(done), height: H - m.t - m.b, fill: "#182A47" }));
  [0.5, 1].forEach(f => svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(hi * f), y2: Y(hi * f), stroke: css("--grid") })));
  svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "#2A3A55" }));
  [[B, "--orange"], [A, "--blue"]].forEach(([s, token]) => {
    const pts = i => `${X(i).toFixed(1)},${Y(s[i]).toFixed(1)}`;
    svg.append(svgEl("polyline", { points: s.slice(0, done + 1).map((_, i) => pts(i)).join(" "), fill: "none",
                                   stroke: css(token), "stroke-width": 3, "stroke-linejoin": "round" }));
    svg.append(svgEl("polyline", { points: s.slice(done).map((_, i) => pts(i + done)).join(" "), fill: "none",
                                   stroke: css(token), "stroke-width": 2.5, "stroke-dasharray": "4 4" }));
    svg.append(svgEl("circle", { cx: X(done), cy: Y(s[done]), r: 4, fill: css(token) }));
  });
  const ends = [[A[7], "--blue"], [B[7], "--orange"]].sort((x, y) => y[0] - x[0]);  // the higher one on top, kept apart
  const ys = [Y(ends[0][0]), Math.max(Y(ends[1][0]), Y(ends[0][0]) + 15)];
  ends.forEach(([v, token], k) => svg.append(svgEl("text", { x: X(7) + 4, y: ys[k] + 4, fill: css(token), "font-weight": 700 }, f0(v))));
  days.forEach((d, i) => svg.append(svgEl("text", { x: X(i + 1), y: H - 6, "text-anchor": "middle",
    "font-weight": d === data.date ? 700 : 400 }, fmtDay(d, { weekday: "short" }))));
  card.append(svg);
  const legend = el("div", { class: "legend" });
  legend.append(key("--blue", "You"), key("--orange", data.opponent), el("span", {}, "Solid: banked · dashed: expected"));
  card.append(legend);

}

// ---- the nights ahead: lineup games, you vs them ----------------------------------
let nightsView = recall("nightsView", "points");
function nightsCard() {
  const s = data.schedule;
  const today = data.date;
  const byDay = t => (t && t.by_day) || null;
  const points = !CARD && nightsView === "points" && byDay(data.header.me) && byDay(data.header.them);
  const nights = s.days.map((d, i) => ({ ...d,
    mine: points ? (data.header.me.by_day[d.date] ?? 0) : s.my_games[i],
    theirs: points ? (data.header.them.by_day[d.date] ?? 0) : s.their_games[i],
    games: [s.my_games[i], s.their_games[i]] }))
    .filter(d => d.date >= today && d.week === data.week);

    card.append(tabsEl([["points", "Points"], ["games", "Games"]], nightsView, v => { nightsView = v; remember("nightsView", v); render(); }));
  card.append(el("h2", {}, points ? "Nights left: expected points" : "Nights left: lineup games"));
  if (!nights.length) { card.append(el("div", { class: "note" }, "No games left this week.")); return card; }

  const hi = Math.max(4, ...nights.map(n => Math.max(n.mine, n.theirs)));
  const fmt = v => points ? v.toFixed(0) : v;
  const band = (W - m.l - m.r) / nights.length, bw = Math.min(16, band * 0.32);
  const Y = v => m.t + (1 - v / hi) * (H - m.t - m.b);

  for (const t of [0, Math.round(hi / 2), Math.round(hi)]) {

    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  }

      const g = n.games[k === "mine" ? 0 : 1];

                  `${n.label} ${n.day}`].concat(points ? [`${g} lineup games`] : []));
      svg.append(bar);

    });

  });

  card.append(legend);

}

// ---- top moves: what each is worth ------------------------------------------------
const PARTS = [["now_wins", "--blue", "This week"], ["ahead", "--orange", "Weeks +1, +2"], ["later_wins", "--aqua", "Later"]];

  const last = n => n.split(" ").slice(1).join(" ") || n;
  return r.drop ? `${last(r.add.name)} for ${last(r.drop.name)}` : r.ir_slot ? `${last(r.add.name)} (${r.ir_slot})` : `${last(r.add.name)} (open spot)`;
}
// ---- Moves: the top moves' value by when it pays, against the add price; every move; the budget ----
function movesBars() {
  const rows = [...data.moves].sort((a, b) => b.value - a.value).slice(0, 8);
  const price = data.header.price ? data.header.price.lam : null, card = el("section", { class: "card" });

  if (price != null) legend.append(el("span", {}, `white line: an add costs ${Math.round(100 * price)}`));
  card.append(legend);
  const hi = 1.05 * Math.max(price || 0, ...rows.map(r => PARTS.reduce((a, [k]) => a + Math.max(0, part(r, k)), 0))) || 1;
  rows.forEach(r => {
    const planned = data.plan.find(p => p.key === r.key);
    const row = el("button", { type: "button", class: "mrow" }), head = el("span", { class: "nc-row" });
    head.append(avatar(r.add.id, 30), el("span", { class: "mname" + (planned ? " on" : "") }, label(r)));
    if (planned) head.append(el("span", { class: "nc-day cond" }, planned.today ? "TODAY" : dayShort(planned.day)));
    head.append(el("span", { class: "nc-val cond num" + (planned ? "" : " dim") }, wp(r.value)));
    const bar = el("span", { class: "mbar" });
    PARTS.forEach(([k, token, name]) => {
      const v = part(r, k);
      if (v <= 0) return;
      const i = el("i");

      i.style.background = css(token);

    });

}
function budgetTokens() {
  const b = data.budget, used = b.used.at(-1) ?? 0, regular = b.cap - b.reserve;
  const card = el("section", { class: "card" }), head = el("div", { class: "nc-row" });
  const left = el("span", { class: "nc-score cond num" }, String(b.cap - used));

  const legend = el("div", { class: "legend" });
  const swatch = (cls, text) => { const sp = el("span"); sp.append(el("i", { class: `tok ${cls}` }), document.createTextNode(text)); return sp; };
  legend.append(swatch("t-used", `Used: ${used}`), swatch("t-open", `Regular season: ${Math.max(regular - used, 0)}`),
                swatch("t-kept", `Kept for the playoffs: ${b.reserve}`));
  const week = data.header.adds_left.week;

    `On an even pace you'd have used ${b.pace[b.week - 1].toFixed(1)} by now. This week: ${week} add${week === 1 ? "" : "s"} left.`));

}

// ---- Schedule: my lineup night by night (this week and the next two), then every team's games ----
let schedWeek = null, schedPlan = recall("schedPlan", "plan") === "plan", schedView = recall("schedView", "players");
let streamAll = false;
function schedDays() {

  (data.weeks || []).forEach(w => {

    if (!ix.length) return;

    return `M${X(a)},${Y(0)} L${pts.join(" L")} L${X(b)},${Y(0)} Z`;

  svg.append(svgEl("line", { x1: X(0), x2: X(0), y1: m.t - 6, y2: Y(0), stroke: css("--text"), "stroke-width": 1.5 }));
  svg.append(svgEl("text", { x: X(0), y: m.t - 10, "text-anchor": "middle", fill: css("--text") }, "even"));

function kvTable(head, rows, sumLast = false) {

function perGameBars(players, tokens) {

    const per = players[0].goalie ? "a start" : "a game";

                   Object.keys(players[0].stats).map(c => [c, ...players.map(p => f2(p.stats[c]))]));

                                          top: n > 1 ? (i ? "55%" : "0") : "0", h: n > 1 ? "45%" : "100%",

    barRow(box, c, "", track(segs, lo, hi, n > 1 ? "pair" : ""),
           n > 1 ? valSub(f2(segs[0].v), `/ ${f2(segs[1].v)}`) : f2(segs[0].v), null);
  });

// What the model said before each game against what he scored (report.season_view).
function seasonVsProjection(p) {
  const s = p.season, out = [];
  out.push(el("h3", {}, "Season so far: projected vs actual"));
  if (!s) { out.push(el("p", { class: "aside" }, "No games yet this season.")); return out; }
  const games = p.goalie ? s.starts : s.gp, actual = s.pts_projected, diff = actual - s.proj;
  const unit = p.goalie ? "start" : "game";
  const facts = el("div", { class: "facts num" });
  const add = (k, v) => facts.append(el("span", {}, k), el("span", {}, v));
  add(p.goalie ? "Starts" : "Games", String(games) + (p.goalie && s.relief ? ` (+${s.relief} in relief, ${f1(s.pts - actual)} pts)` : ""));
  if (games) {
    add("Actual", `${f1(actual)} pts (${f2(actual / games)} a ${unit})`);
    add("Projected", `${f1(s.proj)} pts (${f2(s.proj / games)} a ${unit})`);
    add("Difference", `${signed(diff)} pts (${signed(diff / games, 2)} a ${unit})`);
  }
  out.push(facts);
  const rows = Object.entries(s.stats).map(([c, [a, x]]) => [c, f0(a), f1(x), signed(a - x)]);

  if ((s.last || []).length) {

  out.push(el("div", { class: "note" }, "Projected: what the model said before each game, from his games until then (today's prior and team ratings). " +

const STATUS = { plan: "In the plan", passes: "Worth an add", fails: "Under the price" };
function waterfall(r) {
  const h = data.header;
  const steps = [["This week", r.now_wins, "--blue"]]
    .concat((h.ahead || []).map((w, k) => [`Wk ${w.week}`, (r.ahead_wins || [])[k] || 0, "--orange"]))
    .concat([["Later", r.later_wins, "--aqua"]]);
  const price = h.price ? h.price.lam : null;
  let run = 0;
  const bars = steps.map(([name, v, token]) => { const a = run; run += v; return { name, a, b: run, v, token }; });
  bars.push({ name: "In all", a: 0, b: r.value, v: r.value, token: "--text-2", total: true });
  const all = bars.flatMap(b => [b.a, b.b]).concat(price != null ? [price] : []).concat([0]);
  const lo = Math.min(...all) * 100, hi = Math.max(...all) * 100;
  const W = width() - 4, H = 190, m = { l: 30, r: 8, t: 18, b: 24 };
  const band = (W - m.l - m.r) / bars.length, bw = Math.min(40, band * 0.56);
  const Y = v => m.t + (hi - v) / ((hi - lo) || 1) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "The move's value, step by step" });
  const ticks = []; const span = hi - lo, st = span > 40 ? 20 : span > 16 ? 10 : 5;
  for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) ticks.push(t);
  ticks.forEach(t => {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css(t === 0 ? "--muted" : "--grid") }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  });
  bars.forEach((b, i) => {
    const x = m.l + band * i + (band - bw) / 2;
    const y1 = Y(Math.max(b.a, b.b) * 100), y2 = Y(Math.min(b.a, b.b) * 100);
    const rect = svgEl("rect", { x, y: y1, width: bw, height: Math.max(1.5, y2 - y1), rx: 3, fill: css(b.token) });
    hover(rect, [b.name, `${wp(b.v)} win-pts`].concat(b.total ? [] : [`Running total: ${wp(b.b)}`]));
    svg.append(rect);

  if (both) {
    const big = c => Math.max(Math.abs(a.per_game[c]), d ? Math.abs(d.per_game[c] || 0) : 0);
    const sbox = el("div", { class: "nc-tile" }), cats = Object.keys(a.per_game).sort((x, y) => big(y) - big(x)).slice(0, 4);
    sbox.append(el("b", { style: "font-size:14px" }, `A ${a.goalie ? "start" : "game"}, the biggest stats`));
    const top = Math.max(...cats.map(big), 0.1);
    const g = el("div", { class: "nc-stats" });
    cats.forEach(c => {
      const left = el("div", { class: "nc-l" }), right = el("div");
      const bar = (v, color) => { const i = el("i"); i.style.width = `${(100 * Math.abs(v) / top).toFixed(1)}%`; i.style.background = color; return i; };
      left.append(bar(a.per_game[c], "#4D9BF0"));
      if (d) right.append(bar(d.per_game[c] || 0, "#F07A45"));
      g.append(left, el("span", {}, c), right);
    });
    sbox.append(g);
    card.append(sbox);
  }
  return card;
}

// ---- Monday's result (?card=result): the final score, the race day by day, the forecast, the moves ----
// Its data is engine/report.result_view's, not the dashboard's.
function resultCard() {
  const v = data, [me, them] = v.final, card = el("div", { class: "nc" }), top = el("div", { class: "nc-top" });
  const title = el("span", { class: "nc-week cond" }, `WEEK ${v.week} `);
  title.append(el("span", {}, v.finished ? "· final" : "· so far"));
  const outcome = !v.finished ? null : me > them ? ["WIN", "#2CC28B"] : me < them ? ["LOSS", "#F07A45"] : ["TIE", "#B7C2D3"];
  top.append(title);
  if (outcome) {
    const badge = el("span", { class: "cond", style: `background:${outcome[1]};color:#0B1422;font-size:18px;letter-spacing:.1em;padding:2px 12px;border-radius:6px` }, outcome[0]);
    top.append(badge);
  }
  card.append(top);
  const score = el("div", { class: "nc-tile", style: "flex-direction:row;justify-content:space-around;align-items:center" });
  [["You", me, "#FFFFFF"], [shortTeam(v.opponent), them, "#B7C2D3"]].forEach(([name, pts, ink], i) => {
    const side = el("div", { style: "display:flex;flex-direction:column;align-items:center;gap:4px" });
    side.append(el("span", { class: "nc-big cond num", style: `font-size:56px;color:${ink}` }, f0(pts)),
                el("span", { style: "font-size:14px;font-weight:600" }, name));
    score.append(side);
    if (!i) score.append(el("span", { class: "nc-big cond", style: "color:#5D6F88;font-size:34px" }, ":"));
  });
  card.append(score);
  const facts = [];
  if (v.plan) facts.push(`Monday's forecast: ${f0(v.plan.expected[0])}-${f0(v.plan.expected[1])}, ${pct(v.plan.win)} to win`);
  ["You", "They"].forEach((who, i) => { if (!v.goalie_min[i]) facts.push(`${who} missed the goalie minimum`); });
  if (facts.length) card.append(el("div", { class: "nc-dim", style: "margin-top:-4px;white-space:normal" }, facts.join(" · ")));
  // The race: each team's points so far, day by day.
  const race = el("div", { class: "nc-tile" }), head = el("div", { class: "nc-row" });
  const best = v.mine.reduce((b, x, i) => x > v.mine[b] ? i : b, 0);
  head.append(el("b", { style: "font-size:14px" }, "The race, day by day"),
              el("span", { class: "nc-dim" }, `${fmtDay(v.days[best], { weekday: "long" })}'s ${f0(v.mine[best])}-pt night`));
  race.append(head);
  const W = 330, H = 160, m = { l: 8, r: 8, t: 10, b: 24 }, n = v.days.length;
  const cum = xs => xs.reduce((a, x) => a.concat(a.at(-1) + x), [0]);
  const A = cum(v.mine), B = cum(v.theirs), hi = Math.max(...A, ...B, 1);
  const X = i => m.l + i * (W - m.l - m.r) / n, Y = y => m.t + (1 - y / hi) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "big-text", role: "img", "aria-label": "Each team's points, day by day" });
  [0.5, 1].forEach(f => svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(hi * f), y2: Y(hi * f), stroke: "#1E2E48" })));
  svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "#2A3A55" }));
  [[B, "#F07A45", 2.5], [A, "#4D9BF0", 3]].forEach(([s, c, w]) => {
    svg.append(svgEl("polyline", { points: s.map((y, i) => `${X(i)},${Y(y)}`).join(" "), fill: "none", stroke: c,
                                   "stroke-width": w, "stroke-linejoin": "round" }));
    svg.append(svgEl("circle", { cx: X(n), cy: Y(s.at(-1)), r: 4, fill: c }));
  });
  v.days.forEach((d, i) => svg.append(svgEl("text", { x: X(i + 1), y: H - 6, "text-anchor": "middle", fill: "#B7C2D3",
                                                      "font-size": 13 }, fmtDay(d, { weekday: "narrow" }))));
  race.append(svg);
  const key = el("div", { class: "nc-dim" });
  key.append(el("span", { style: "color:#7DB8FF;font-weight:700" }, "You"), document.createTextNode(" · "),
             el("span", { style: "color:#FFA57D;font-weight:700" }, v.opponent));
  race.append(key);
  card.append(race);
  // The moves: what each did, and the adds left.
  const moves = el("div", { class: "nc-tile" });
  moves.append(el("b", { style: "font-size:14px" }, "Your moves"));
  const lines = (v.moves_text || "").split("\n").filter(Boolean);
  if (v.added && v.added.length) lines.unshift(`Added: ${v.added.join(", ")}`);
  if (!lines.length) lines.push("No adds this week.");
  lines.forEach(l => moves.append(el("div", { class: "nc-detail" }, l)));
  const b = v.budget, used = b.used.length ? b.used.at(-1) : 0;
  moves.append(el("div", { class: "nc-dim" }, `${b.cap - used} adds left · ${used} used vs ${b.pace[v.week - 1].toFixed(1)} at an even pace`));
  card.append(moves);
  return card;
}

// The screenshot waits for the fonts and the headshots (or their failure), at most a few seconds.
function settled(ms = 5000) {
  const imgs = [...app.querySelectorAll("img")].filter(i => !i.complete)
    .map(i => new Promise(done => { i.addEventListener("load", done); i.addEventListener("error", done); }));
  return Promise.race([Promise.all([document.fonts.ready, ...imgs]), new Promise(done => setTimeout(done, ms))]);
}

// One card that can't be drawn (data from another version of the page, a bug)
// says so in its place; the rest of the page still shows.
function safe(build) {
  try { return build(); } catch (e) {
    console.error(build.name, e);
    const card = el("section", { class: "card" });
    card.append(el("div", { class: "note" }, `This part couldn't be drawn (${build.name}: ${e.message}).`));
    return card;
  }
}
function message(text) { app.removeAttribute("aria-busy"); app.replaceChildren(el("p", { class: "empty" }, text)); }
function render() {
  if (!data) return;
  if (CARD === "result") {  // Monday's result: its own data (engine/report.result_view)
    document.body.classList.add("card-mode");
    app.replaceChildren(safe(resultCard));
    settled().then(() => { document.body.dataset.ready = "1"; });
    return;
  }
  if (!data.header || !data.plan) {  // the data is an older version's (a deploy in progress)
    message("The dashboard is updating. Reopen it in a minute.");
    document.body.dataset.ready = "1";
    return;
  }
  if (CARD) {
    document.body.classList.add("card-mode");
    app.replaceChildren(safe(CARD === "move" ? moveCard : nightCard));
    settled().then(() => { document.body.dataset.ready = "1"; });  // notify/snapshot.py waits for this
    return;
  } else {
    document.body.classList.add("dash");
    app.classList.add("nc");
    const pages = { today: [todayTop, planSection, raceCard, whyCard, nightsCard, weekTiles],
                    matchup: [playersCard, statsCard], moves: [movesBars, moveTable, budgetTokens],
                    schedule: [weekPicker, scheduleCard, streamCard], watch: [watchCard] };
    app.replaceChildren(...(pages[tab] || pages.today).map(safe).filter(Boolean));
    document.querySelector(".tabbar")?.remove();
    document.body.append(tabBar());
    drawSheet();
  }
  document.body.dataset.ready = "1";  // notify/snapshot.py waits for this
}

(window.__DATA__ ? Promise.resolve(window.__DATA__)
  : fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(d => { data = d; app.removeAttribute("aria-busy"); render(); openLinked(); })
  .catch(e => message(e.message === "404" ? "No plan yet: send /week to the bot."
                                          : `The plan couldn't be loaded (${e.message}). Reopen the page to try again.`));
// A link to one move or player (a card's "Why?": #move=KEY, or #player=ID) opens its sheet.
function openLinked() {
  const m = location.hash.match(/^#(move|player)=(.+)$/);
  if (m && !CARD) openSheet(m[1], decodeURIComponent(m[2]));
}
// Only a new width redraws: a phone's address bar showing or hiding fires resize on
// scroll, and a redraw would rebuild an open sheet back at its top.
let resizeTimer, lastWidth = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastWidth) return;
  lastWidth = innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});
addEventListener("hashchange", () => {  // a tab's link, or a move's or player's (a card's "Why?")
  if (hashTab() && hashTab() !== tab) { tab = hashTab(); render(); } else openLinked();
});
</script>
