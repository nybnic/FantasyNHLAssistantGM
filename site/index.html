<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant GM</title>
<meta name="robots" content="noindex">
<style>
  /* Tokens: the dataviz reference palette (slots 1-3: blue, orange, aqua; validated
     all-pairs for colour-blind separation in both modes). Dark values are their own steps. */
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --grid: #e6e5e1; --blue: #2a78d6; --blue-soft: #86b6ef; --orange: #eb6834; --aqua: #1baf7a; --neutral: #a3a29d;
    --on-blue: #ffffff; --orange-soft: #f5b398;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --card: #232321; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
      --grid: #383835; --blue: #3987e5; --blue-soft: #1c5cab; --orange: #d95926; --aqua: #199e70; --neutral: #6f6e69; --orange-soft: #8f3d1c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --card: #232321; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
    --grid: #383835; --blue: #3987e5; --blue-soft: #1c5cab; --orange: #d95926; --aqua: #199e70; --neutral: #6f6e69; --orange-soft: #8f3d1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  body.card-mode main { max-width: 440px; padding: 14px 14px 16px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .sub, .note { color: var(--text-2); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hero .big { font-size: 48px; font-weight: 650; line-height: 1; }
  .facts { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; }
  .facts span:nth-child(odd) { color: var(--text-2); }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--text-2); font-size: 11px; }
  .tip { position: fixed; pointer-events: none; background: var(--card); color: var(--text); border: 1px solid var(--grid);
         border-radius: 8px; padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none;
         max-width: 260px; z-index: 5; }
  .tip b { display: block; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  /* the plan */
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--grid); }
  .plan li:first-child { border-top: 0; padding-top: 0; }
  .day { flex: none; min-width: 58px; font-size: 12px; font-weight: 600; text-align: center; border-radius: 6px;
         padding: 2px 6px; border: 1px solid var(--blue); color: var(--text); }
  .day.today { background: var(--blue); color: var(--on-blue); }
  .swap { font-weight: 600; }
  .changed { margin: 8px 0 0; padding: 6px 8px; border-left: 3px solid var(--orange); font-size: 13px; }
  .aside { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
  /* weeks */
  .weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .wk { border: 1px solid var(--grid); border-radius: 10px; padding: 8px; min-width: 0; }
  .wk.now { border-color: var(--blue); }
  .wk .v { font-size: 24px; font-weight: 650; line-height: 1.1; }
  .wk .l { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* grid */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -4px 0; padding: 0 4px; }
  table { border-collapse: collapse; font-size: 12px; }
  .grid th, .grid td { padding: 2px 1px; text-align: center; min-width: 30px; }
  .grid th.name, .grid td.name { text-align: left; white-space: nowrap; padding-right: 8px; position: sticky; left: 0;
                                  background: var(--card); min-width: 0; font-weight: 400; }
  .grid thead th { color: var(--text-2); font-weight: 400; }
  .grid .wkh { font-weight: 600; color: var(--text); }
  .grid .brk { border-left: 1px solid var(--muted); }
  .cell { width: 26px; height: 20px; border-radius: 4px; margin: 0 auto; font-size: 10px; line-height: 20px; }
  .cell.start { background: var(--blue); color: var(--on-blue); }
  .cell.bench { background: var(--orange); color: #0b0b0b; }
  .cell.s-start { border: 2px solid var(--blue); }
  .cell.s-bench { border: 2px solid var(--orange); }
  tr.sep td { border-top: 1px solid var(--grid); padding-top: 6px; }
  .grid th.today { color: var(--text); font-weight: 600; }
  .tabs { float: right; display: flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
  .tabs button { background: none; border: 0; color: var(--text-2); font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .tabs button.on { background: var(--blue); color: var(--on-blue); }
  .badge { font-size: 10px; font-weight: 600; color: var(--on-blue); background: var(--blue); border-radius: 4px;
           padding: 0 4px; margin-right: 5px; }
  tr.planrow .name { font-weight: 600; }
  .toggle { display: block; font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .dots { display: flex; gap: 2px; justify-content: center; align-items: center; height: 20px; }
  .dots.square { flex-wrap: wrap; width: 16px; margin: 0 auto; gap: 2px; align-content: center; }
  .dots i { display: block; flex: none; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; }
  .dots i.d-full { background: var(--blue); }
  .dots i.d-empty { border: 1px solid var(--muted); }
  .dots i.d-added { background: var(--aqua); }
  .dots i.d-freed { border: 2px solid var(--aqua); }
  .lost { color: var(--orange); font-weight: 600; }
  .open { font-weight: 600; }
  .zero { color: var(--muted); }
  /* move table */
  .moves { width: 100%; }
  .moves th { text-align: right; color: var(--text-2); font-weight: 400; padding: 4px 5px; border-bottom: 1px solid var(--grid);
              white-space: nowrap; cursor: pointer; }
  .moves th:first-child { text-align: left; }
  .moves td { padding: 5px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: right; white-space: nowrap; }
  .moves td:first-child { text-align: left; white-space: normal; min-width: 116px; }
  .moves th, .moves td { font-size: 12px; }
  .moves .why { color: var(--text-2); font-size: 11px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .more { margin-top: 8px; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
          font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .empty { color: var(--text-2); padding: 40px 0; text-align: center; }
  button.theme { float: right; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
                 font-size: 12px; padding: 3px 8px; cursor: pointer; }
  /* breakdowns: bars as HTML rows (tap a row for its sheet) */
  .bars { display: grid; grid-template-columns: minmax(96px, 38%) 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
  .bars .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars .lbl small { color: var(--text-2); margin-left: 4px; }
  .bars .val { text-align: right; white-space: nowrap; font-size: 12px; color: var(--text); }
  .bars .val small { color: var(--text-2); }
  .bars .row { display: contents; cursor: pointer; }
  .bars .row.muted .lbl, .bars .row.muted .val { color: var(--muted); }
  .bars .total { font-weight: 600; }
  .bars .lbl.total { grid-column: span 2; }
  .bars .rule { grid-column: 1 / -1; border-top: 1px solid var(--grid); }
  .track { position: relative; height: 14px; }
  .track.pair { height: 22px; }
  .seg { position: absolute; border-radius: 3px; }
  .seg.ghost { background: transparent !important; border: 1.5px dashed; }
  .zline { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .pricemark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }
  .stack { display: flex; height: 22px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .stack div { height: 100%; }
  .scoreline { display: grid; grid-template-columns: 64px 1fr auto; gap: 6px 8px; align-items: center; font-size: 13px; }
  /* sheets: a player's or a move's numbers */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 8; display: flex; align-items: flex-end;
              justify-content: center; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto;
           border-radius: 14px 14px 0 0; padding: 16px 16px 28px; box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
  .sheet h3 { margin: 14px 0 6px; font-size: 14px; }
  .sheet .close { float: right; background: none; border: 1px solid var(--grid); color: var(--text-2); border-radius: 6px;
                  font-size: 13px; padding: 3px 10px; cursor: pointer; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-left: 6px;
          border: 1px solid var(--grid); color: var(--text-2); vertical-align: 2px; }
  .chip.plan { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .kv { width: 100%; font-size: 13px; }
  .kv td, .kv th { padding: 4px 6px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  .kv td:first-child, .kv th:first-child { text-align: left; white-space: normal; }
  .kv th { color: var(--text-2); font-weight: 400; }
  .kv tr.sum td { font-weight: 650; border-bottom: 0; }
  .linkish { background: none; border: 1px solid var(--grid); color: var(--text); border-radius: 6px; font-size: 12px;
             padding: 3px 9px; cursor: pointer; margin: 6px 6px 0 0; }
  .tap { cursor: pointer; }
  .flags { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading...</p></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
// The dashboard of the plan (bot/weekly.dashboard_data writes data.json from the Board).
// ?card renders the compact card the bot screenshots for Telegram (notify/snapshot.py).
const NS = "http://www.w3.org/2000/svg";
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const CARD = window.__CARD__ || new URLSearchParams(location.search).has("card");
let data = null, showAll = false, sortKey = "value";

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = p => `${Math.round(Math.min(Math.max(p, 0.01), 0.99) * 100)}%`;
const signed = (v, d = 1) => { const t = Math.abs(v).toFixed(d); return (v < 0 && +t ? "-" : "+") + t; };  // no "-0.0"
const wp = v => { const r = Math.round(100 * v); return (r > 0 ? "+" : "") + r; };  // win-pts, no "-0"
const width = () => Math.max(280, Math.min(app.clientWidth - 30, 728));
const pair = v => `${v[0].toFixed(0)}-${v[1].toFixed(0)}`;
function fmtDay(iso, opts = { weekday: "short", day: "numeric", month: "short" }) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", opts);
}
function showTip(evt, lines) {
  tip.replaceChildren();
  lines.forEach((line, i) => tip.append(el(i === 0 ? "b" : "div", {}, line)));
  tip.style.display = "block";
  const x = Math.min(evt.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${Math.max(8, x)}px`;
  tip.style.top = `${evt.clientY + 14}px`;
}
const hideTip = () => { tip.style.display = "none"; };
function hover(node, lines) {
  node.addEventListener("pointermove", e => showTip(e, lines));
  node.addEventListener("pointerleave", hideTip);
}
function key(token, label) {
  const s = el("span"); const i = el("i"); i.style.background = css(token); s.append(i, document.createTextNode(label)); return s;
}

// ---- header ---------------------------------------------------------------
function header() {
  const h = data.header;
  const box = el("section");
  if (!CARD) {
    const theme = el("button", { class: "theme", type: "button" }, "Theme");
    theme.onclick = () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
      render();
    };
    box.append(theme);
  }
  box.append(el("h1", {}, `Week ${data.week} vs ${data.opponent}`));
  const updated = new Date(data.generated);
  box.append(el("div", { class: "sub" }, `${fmtDay(data.days[0])} - ${fmtDay(data.days[1])} · updated ${updated.toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" })}`));
  const card = el("div", { class: "card" });
  const hero = el("div", { class: "hero" });
  const big = el("div");
  big.append(el("div", { class: "big num" }, pct(h.win)), el("div", { class: "sub" }, "chance to win this week"));
  const facts = el("div", { class: "facts num" });
  const rows = [];
  if (h.me.so_far || h.them.so_far) rows.push(["So far", pair([h.me.so_far, h.them.so_far])]);
  rows.push(["Projected", pair([h.me.expected, h.them.expected])]);
  if (h.yahoo_projected) rows.push(["Yahoo", pair(h.yahoo_projected)]);
  rows.push(["Adds left", `${h.adds_left.week} this week, ${h.adds_left.season} season`]);
  if (h.season) rows.push(["Season", `playoffs ${pct(h.season.playoffs)}, title ${pct(h.season.title)}`]);
  rows.forEach(([k, v]) => facts.append(el("span", {}, k), el("span", {}, v)));
  hero.append(big, facts);
  card.append(hero);
  box.append(card);
  return box;
}

// ---- the plan ---------------------------------------------------------------
function planCard() {
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "The plan"));
  if (!data.plan.length) card.append(el("div", {}, data.plan_empty));
  const list = el("ul", { class: "plan" });
  data.plan.forEach(p => {
    const li = el("li");
    if (!CARD && data.moves.some(r => r.key === p.key)) { li.classList.add("tap"); li.onclick = () => openSheet("move", p.key); }
    li.append(el("span", { class: "day" + (p.today ? " today" : "") }, p.day));
    const body = el("div");
    body.append(el("div", { class: "swap" }, p.swap), el("div", { class: "note" }, p.detail));
    li.append(body);
    list.append(li);
  });
  card.append(list);
  if (data.changed) card.append(el("p", { class: "changed" }, `Changed since the last plan: ${data.changed}.`));
  if (data.this_week_line) card.append(el("p", { class: "aside" }, data.this_week_line));
  return card;
}

// ---- this week and the next two ----------------------------------------------
function weeksCard() {
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "This week and the next two"));
  const grid = el("div", { class: "weeks" });
  data.weeks.forEach((w, i) => {
    const t = el("div", { class: "wk" + (i === 0 ? " now" : "") });
    t.append(el("div", { class: "l" }, i === 0 ? `Week ${w.week}, now` : `Week ${w.week}`),
             el("div", { class: "v num" }, w.win == null ? "?" : pct(w.win)),
             el("div", { class: "l" }, w.opponent ? `vs ${w.opponent}` : "opponent not known"));
    if (w.margin != null) t.append(el("div", { class: "l num", title: "expected margin" }, `${signed(w.margin, 0)} pts`));
    grid.append(t);
  });
  card.append(grid);
  if (!CARD) card.append(el("div", { class: "note", style: "margin-top:8px" },
    "Later weeks are played against their real opponents: a point there counts by how close that week is."));
  return card;
}

// ---- the nights ahead: lineup games, you vs them ----------------------------------
let nightsView = recall("nightsView", "points");
function nightsCard() {
  const s = data.schedule;
  const today = data.date;
  const byDay = t => (t && t.by_day) || null;
  const points = !CARD && nightsView === "points" && byDay(data.header.me) && byDay(data.header.them);
  const nights = s.days.map((d, i) => ({ ...d,
    mine: points ? (data.header.me.by_day[d.date] ?? 0) : s.my_games[i],
    theirs: points ? (data.header.them.by_day[d.date] ?? 0) : s.their_games[i],
    games: [s.my_games[i], s.their_games[i]] }))
    .filter(d => d.date >= today && d.week === data.week);
  const card = el("section", { class: "card" });
  if (!CARD && byDay(data.header.me))
    card.append(tabsEl([["points", "Points"], ["games", "Games"]], nightsView, v => { nightsView = v; remember("nightsView", v); render(); }));
  card.append(el("h2", {}, points ? "Expected points left, night by night" : "Lineup games left this week"));
  if (!nights.length) { card.append(el("div", { class: "note" }, "No games left this week.")); return card; }
  const W = width(), H = 150, m = { l: 26, r: 6, t: 16, b: 22 };
  const hi = Math.max(4, ...nights.map(n => Math.max(n.mine, n.theirs)));
  const fmt = v => points ? v.toFixed(0) : v;
  const band = (W - m.l - m.r) / nights.length, bw = Math.min(16, band * 0.32);
  const Y = v => m.t + (1 - v / hi) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Lineup games per night, you and them" });
  for (const t of [0, Math.round(hi / 2), Math.round(hi)]) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css("--grid") }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  }
  nights.forEach((n, i) => {
    const cx = m.l + band * (i + 0.5);
    [["mine", "--blue", -1], ["theirs", "--orange", 1]].forEach(([k, token, side]) => {
      const v = n[k], x = cx + side * (bw / 2 + 1) - bw / 2;
      const bar = svgEl("rect", { x, y: Y(v), width: bw, height: Math.max(0, Y(0) - Y(v)), rx: 3, fill: css(token) });
      const g = n.games[k === "mine" ? 0 : 1];
      hover(bar, [`${k === "mine" ? "You" : "Them"}: ${points ? `${v.toFixed(1)} pts expected` : `${v} lineup games`}`,
                  `${n.label} ${n.day}`].concat(points ? [`${g} lineup games`] : []));
      svg.append(bar);
      if (CARD || nights.length <= 7) svg.append(svgEl("text", { x: x + bw / 2, y: Y(v) - 4, "text-anchor": "middle", fill: css("--text") }, fmt(v)));
    });
    svg.append(svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle" }, n.date === today ? "Tonight" : `${n.label} ${n.day}`));
  });
  card.append(svg);
  const legend = el("div", { class: "legend" });
  const total = k => nights.reduce((a, n) => a + n[k], 0);
  legend.append(key("--blue", `You: ${fmt(total("mine"))}`), key("--orange", `${data.opponent}: ${fmt(total("theirs"))}`));
  card.append(legend);
  return card;
}

// ---- top moves: what each is worth ------------------------------------------------
const PARTS = [["now_wins", "--blue", "This week"], ["ahead", "--orange", "Weeks +1, +2"], ["later_wins", "--aqua", "Later"]];
const part = (r, k) => k === "ahead" ? (r.ahead_wins || []).reduce((a, b) => a + b, 0) : r[k];
function label(r) {
  const last = n => n.split(" ").slice(1).join(" ") || n;
  return r.drop ? `${last(r.add.name)} for ${last(r.drop.name)}` : r.ir_slot ? `${last(r.add.name)} (${r.ir_slot})` : `${last(r.add.name)} (open spot)`;
}
function valueCard() {
  const rows = [...data.moves].sort((a, b) => b.value - a.value).slice(0, 8);
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "Top moves: what each is worth"));
  card.append(el("div", { class: "note" }, "In win-pts: percentage points of a weekly win, summed over this week, the next two and later."));
  if (!rows.length) return card;
  const price = data.header.price ? data.header.price.lam : null;
  const W = width(), rowH = 26, m = { l: 132, r: 40, t: 18, b: 8 }, H = m.t + m.b + rowH * rows.length;
  const lo = Math.min(0, ...rows.map(r => PARTS.reduce((a, [k]) => a + Math.min(0, part(r, k)), 0)));
  const hi = Math.max(price || 0, ...rows.map(r => PARTS.reduce((a, [k]) => a + Math.max(0, part(r, k)), 0)));

    const rest = t.expected - t.so_far;
    score.append(el("span", { class: "lbl" }, name === "You" ? "You" : "Them"),
                 track([{ v: t.so_far, token: solid, tip: [name, `Banked so far: ${f1(t.so_far)}`] },
                        { v: rest, token: soft, tip: [name, `Rest of the week: ${f1(rest)} expected`,
                                                       `Goalies reach 3 starts: ${pct(t.goalie_min)}`] }], 0, hi, "pair"),
                 el("span", { class: "val" }, t.so_far ? `${f0(t.so_far)} + ${f0(rest)} = ${f0(t.expected)}` : f0(t.expected)));
  });
  card.append(score);
  card.append(el("div", { class: "note", style: "margin-top:6px" }, `Solid: banked so far. Light: still to come. Them: ${opp}.`));

  const Y = d => m.t + (1 - d) * (H - m.t - m.b);

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Final margin: ${signed(mu, 0)} expected, win ${pct(h.win)}` });
  const area = (a, b) => {
    if (b <= a) return "";

    return `M${X(a)},${Y(0)} L${pts.join(" L")} L${X(b)},${Y(0)} Z`;
  };
  svg.append(svgEl("path", { d: area(lo, Math.min(0, top)), fill: css("--neutral"), opacity: 0.45 }));
  svg.append(svgEl("path", { d: area(Math.max(0, lo), top), fill: css("--blue"), opacity: 0.75 }));
  const curve = [];
  for (let i = 0; i <= 120; i++) { const v = lo + (top - lo) * i / 120; curve.push(`${X(v).toFixed(1)},${Y(dens(v)).toFixed(1)}`); }
  svg.append(svgEl("polyline", { points: curve.join(" "), fill: "none", stroke: css("--text-2"), "stroke-width": 2 }));
  svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: css("--grid") }));
  svg.append(svgEl("line", { x1: X(0), x2: X(0), y1: m.t - 8, y2: Y(0), stroke: css("--text"), "stroke-dasharray": "3 3" }));
  svg.append(svgEl("text", { x: X(0) + 4, y: m.t - 10, fill: css("--text") }, `tie: win ${pct(h.win)}`));
  svg.append(svgEl("line", { x1: X(mu), x2: X(mu), y1: Y(1), y2: Y(0), stroke: css("--text-2") }));
  const step = sd > 60 ? 50 : 25;

    svg.append(svgEl("text", { x: X(t), y: H - 8, "text-anchor": "middle" }, t > 0 ? `+${t}` : t));
  svg.append(svgEl("text", { x: X(mu), y: Y(1) - 4, "text-anchor": X(mu) > W - 90 ? "end" : X(mu) < 90 ? "start" : "middle" },
                   `expected ${signed(mu, 0)}`));

  hit.addEventListener("pointermove", e => {

  hit.addEventListener("pointerleave", hideTip);
  svg.append(hit);
  card.append(el("h3", { style: "margin:14px 0 2px;font-size:14px" }, "The final margin, you minus them"));
  card.append(svg);
  const lost = [["you", h.me], ["they", h.them]].filter(([, t]) => t.goalie_lost > 0.5)
    .map(([who, t]) => `${who === "you" ? "Your" : "Their"} goalies reach 3 starts ${pct(t.goalie_min)}: the minimum costs ${f1(t.goalie_lost)} pts expected.`);
  card.append(el("div", { class: "note" },
    `${signed(mu, 0)} ± ${f0(sd)} pts. Blue: the outcomes you win. Banked points count in full, the rest at 80% of its ` +
    `projected size (how projected margins have come true). ${lost.join(" ")}`));
  return card;
}

// ---- player by player ---------------------------------------------------------------
let side = recall("teamSide", "me");
function playersCard() {
  const T = data.teams;
  if (!T || !T.me || !T.them) return null;
  const card = el("section", { class: "card" });
  card.append(tabsEl([["me", "You"], ["them", lastName(data.opponent)]], side, v => { side = v; remember("teamSide", v); render(); }));
  card.append(el("h2", {}, "Player by player"));
  card.append(el("div", { class: "note" }, "Expected points for the rest of the week in the best lineup each night. Dashed: games with no slot free. Tap a player."));
  const t = T[side], h = data.header[side], token = sideToken(side);
  const rows = t.players;
  const hi = Math.max(1, ...rows.map(r => (r.pts || 0) + (r.bench_pts || 0)));
  const box = el("div", { class: "bars", style: "margin-top:8px" });
  rows.forEach(r => {
    const p = person(r.id) || { name: String(r.id), positions: "" };
    const goalie = p.goalie;
    const tipLines = [p.name, `${f1(r.pts)} pts expected in ${goalie ? `${f1(r.games)} expected starts` : `${f0(r.games)} lineup games`}`]
      .concat(r.bench_pts ? [`${f1(r.bench_pts)} pts on nights with no slot free`] : []);
    const bar = track([{ v: r.pts, token, tip: tipLines }, { v: r.bench_pts, token, ghost: true, tip: tipLines }], 0, hi);
    const value = r.slot ? r.slot : r.pts || r.bench_pts
      ? valSub(f1(r.pts), goalie ? `${f1(r.games)} GS` : `${f0(r.games)} gp`) : "no games";
    barRow(box, shortName(p.name), p.positions, bar, value, person(r.id) ? () => openSheet("player", r.id) : null,
           r.pts ? "" : "muted");
  });
  if (t.goalie_lost > 0.05)
    barRow(box, "Goalie minimum", "", el("span", { class: "note" }, `${pct(h.goalie_min)} to reach 3 starts`),
           `−${f1(t.goalie_lost)}`, null);
  box.append(el("div", { class: "rule" }));
  const sum = el("div", { class: "row" });
  sum.append(el("span", { class: "lbl total" }, "Rest of the week"), el("span", { class: "val total num" }, f1(t.rest)));
  box.append(sum);
  card.append(box);
  card.append(el("div", { class: "note", style: "margin-top:6px" },
    `${f1(h.so_far)} banked + ${f1(t.rest)} to come = ${f1(h.expected)} projected.`));
  return card;
}

// ---- where the points come from, by stat ---------------------------------------------------
function statsCard() {
  const T = data.teams;
  if (!T || !T.me || !T.them) return null;
  const cats = Object.keys(T.me.by_stat).filter(c => c !== "Goalies");
  const vals = cats.flatMap(c => [T.me.by_stat[c], T.them.by_stat[c] ?? 0]);
  const lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const card = el("section", { class: "card" });
  card.append(el("h2", {}, "Where the points come from"));
  card.append(el("div", { class: "note" }, "Rest of the week by stat, you and them."));
  const box = el("div", { class: "bars", style: "margin-top:8px" });
  cats.forEach(c => {
    const a = T.me.by_stat[c], b = T.them.by_stat[c] ?? 0;
    const tip = [c, `You: ${f1(a)}`, `${data.opponent}: ${f1(b)}`, `Difference: ${signed(a - b)}`];
    const bar = track([{ v: a, token: "--blue", alone: true, top: "0", h: "45%", tip },
                       { v: b, token: "--orange", alone: true, top: "55%", h: "45%", tip }], lo, hi, "pair");
    barRow(box, c, "", bar, valSub(f1(a), `/ ${f1(b)}`), null);
  });
  const skaters = side => cats.reduce((a, c) => a + (T[side].by_stat[c] ?? 0), 0);
  [["Skaters", skaters("me"), skaters("them")], ["Goalies", T.me.by_stat.Goalies ?? 0, T.them.by_stat.Goalies ?? 0]].forEach(([name, a, b], i) => {
    if (!i) box.append(el("div", { class: "rule" }));
    const row = el("div", { class: "row" });
    row.append(el("span", { class: "lbl" + (i ? "" : " total"), style: i ? "grid-column: span 2" : "" }, name),
               el("span", { class: "val num" + (i ? "" : " total") }, `${f1(a)} / ${f1(b)}`));
    box.append(row);
  });
  card.append(box);
  card.append(el("div", { class: "note", style: "margin-top:6px" },
    "Goalies are net of what the 3-start minimum costs (it can zero the week's goalie points, banked ones too)."));
  const legend = el("div", { class: "legend" });
  legend.append(key("--blue", "You"), key("--orange", data.opponent));
  card.append(legend);
  return card;
}

// ---- sheets: a player's or a move's numbers -------------------------------------------------
let sheet = null;  // {kind: "player" | "move", id}
function openSheet(kind, id) { sheet = { kind, id }; drawSheet(); }
function closeSheet() { sheet = null; hideTip(); document.querySelector(".backdrop")?.remove(); }
function drawSheet() {
  document.querySelector(".backdrop")?.remove();
  if (!sheet || CARD) return;
  const body = sheet.kind === "player" ? playerSheet(sheet.id) : moveSheet(sheet.id);
  if (!body) { sheet = null; return; }
  const back = el("div", { class: "backdrop" });
  const box = el("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
  const close = el("button", { class: "close", type: "button" }, "Close");
  close.onclick = closeSheet;
  box.append(close, ...body);
  back.append(box);
  back.addEventListener("click", e => { if (e.target === back) closeSheet(); });
  document.body.append(back);
  close.focus({ preventScroll: true });
}
addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });

function kvTable(head, rows, sumLast = false) {
  const t = el("table", { class: "kv num" });
  if (head) { const tr = el("tr"); head.forEach(x => tr.append(el("th", {}, x))); t.append(tr); }
  rows.forEach((r, i) => {
    const tr = el("tr", { class: sumLast && i === rows.length - 1 ? "sum" : "" });
    r.forEach(x => tr.append(el("td", {}, x)));
    t.append(tr);
  });
  return t;
}
function perGameBars(players, tokens) {
  // One row per stat group: each player's points per game (one bar each; paired when two).
  const cats = Object.keys(players[0].per_game || {});
  const vals = cats.flatMap(c => players.map(p => (p.per_game || {})[c] || 0));
  const lo = Math.min(0, ...vals), hi = Math.max(0.1, ...vals);
  const box = el("div", { class: "bars" });
  const n = players.length;
  cats.forEach(c => {
    const segs = players.map((p, i) => ({ v: (p.per_game || {})[c] || 0, token: tokens[i], alone: true,
                                          top: n > 1 ? (i ? "55%" : "0") : "0", h: n > 1 ? "45%" : "100%",
                                          tip: [c].concat(players.map(q => `${shortName(q.name)}: ${f2((q.per_game || {})[c] || 0)} a ${q.goalie ? "start" : "game"}`)) }));
    barRow(box, c, "", track(segs, lo, hi, n > 1 ? "pair" : ""),
           n > 1 ? valSub(f2(segs[0].v), `/ ${f2(segs[1].v)}`) : f2(segs[0].v), null);
  });
  box.append(el("div", { class: "rule" }));
  const sum = el("div", { class: "row" });
  sum.append(el("span", { class: "lbl total" }, "In all"), el("span", { class: "val total num" }, players.map(p => f2(p.xfp)).join(" / ")));
  box.append(sum);
  return box;
}
function ownerLabel(p) { return p.owner === "me" ? "your roster" : p.owner === "them" ? data.opponent : "free agent"; }
function weekRow(p) {
  const T = data.teams || {};
  const t = p.owner === "me" ? T.me : p.owner === "them" ? T.them : null;
  return t ? t.players.find(r => r.id === p.id) : null;
}

function playerSheet(id) {
  const p = person(id);
  if (!p) return null;
  const out = [];
  const title = el("h2", {}, p.name);
  title.append(el("span", { class: "chip" }, ownerLabel(p)));
  out.push(title, el("div", { class: "sub" }, `${p.team} · ${p.positions} · ${p.gp} games this season`));
  const hero = el("div", { class: "hero", style: "margin-top:10px" });
  const big = el("div");
  big.append(el("div", { class: "big num", style: "font-size:40px" }, p.xfp == null ? "?" : f2(p.xfp)),
             el("div", { class: "sub" }, p.goalie ? `points a start${p.next ? ` (next: ${fmtDay(p.next.date, { weekday: "short", day: "numeric" })} ${p.next.opp})` : ""}` : "points a game, as projected"));
  hero.append(big);
  const facts = el("div", { class: "facts num" });
  const add = (k, v) => facts.append(el("span", {}, k), el("span", {}, v));
  if (p.goalie) {
    add("Start share", pct(p.share));
  } else {
    add("Ice time", `${f1(p.toi)} min (PP ${f1(p.pp_toi)})`);
    add("Tonight", p.play >= 0.95 ? "plays" : `${pct(p.play)} to play${p.note ? ` (${p.note})` : ""}`);
    add("Games projected", pct(p.durability));
    add("Long-run points kept", p.replacement != null ? `${pct(p.kept)} (missed games streamed at ${f2(p.replacement)})` : pct(p.kept));
  }
  const w = weekRow(p);
  if (w && (w.pts || w.bench_pts))
    add("Rest of this week", `${f1(w.pts)} pts, ${p.goalie ? `${f1(w.games)} starts` : `${f0(w.games)} lineup games`}` +
        (w.bench_pts ? `, ${f1(w.bench_pts)} on the bench` : ""));
  hero.append(facts);
  out.push(hero);
  if (p.per_game) {
    out.push(el("h3", {}, p.goalie ? "A start, by stat" : "A game, by stat"));
    out.push(perGameBars([p], ["--blue"]));
  }
  if (p.goalie && p.starts && !p.starts.length) out.push(el("p", { class: "aside" }, "No starts left this week."));
  if (p.goalie && p.starts && p.starts.length) {
    out.push(el("h3", {}, "Starts left this week"));
    const hi = Math.max(...p.starts.map(s => s.xfp), 1);
    const box = el("div", { class: "bars" });
    p.starts.forEach(s => {
      const tip = [`${fmtDay(s.date)} ${s.opp}`, `${pct(s.prob)} to start`, `${f1(s.xfp)} pts if he does`, `${f1(s.prob * s.xfp)} expected`];
      barRow(box, fmtDay(s.date, { weekday: "short", day: "numeric" }), s.opp,
             track([{ v: s.prob * s.xfp, token: "--blue", tip }, { v: s.xfp * (1 - s.prob), token: "--blue", ghost: true, tip }], 0, hi),
             valSub(pct(s.prob), `× ${f1(s.xfp)}`), null);
    });
    out.push(box, el("div", { class: "note" }, "Solid: expected points (start odds × points if he starts). Dashed: the rest, if he starts."));
  }
  if (!p.goalie && p.durability < 1)
    out.push(el("p", { class: "aside" }, "A projected missed game costs only his edge over the streamer who'd fill it, so a fringe player's durability barely matters."));
  return out;
}

const STATUS = { plan: "In the plan", passes: "Worth an add", fails: "Under the price" };
function waterfall(r) {
  const h = data.header;
  const steps = [["This week", r.now_wins, "--blue"]]
    .concat((h.ahead || []).map((w, k) => [`Wk ${w.week}`, (r.ahead_wins || [])[k] || 0, "--orange"]))
    .concat([["Later", r.later_wins, "--aqua"]]);
  const price = h.price ? h.price.lam : null;
  let run = 0;
  const bars = steps.map(([name, v, token]) => { const a = run; run += v; return { name, a, b: run, v, token }; });
  bars.push({ name: "In all", a: 0, b: r.value, v: r.value, token: "--text-2", total: true });
  const all = bars.flatMap(b => [b.a, b.b]).concat(price != null ? [price] : []).concat([0]);
  const lo = Math.min(...all) * 100, hi = Math.max(...all) * 100;
  const W = width() - 4, H = 190, m = { l: 30, r: 8, t: 18, b: 24 };
  const band = (W - m.l - m.r) / bars.length, bw = Math.min(40, band * 0.56);
  const Y = v => m.t + (hi - v) / ((hi - lo) || 1) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "The move's value, step by step" });
  const ticks = []; const span = hi - lo, st = span > 40 ? 20 : span > 16 ? 10 : 5;
  for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) ticks.push(t);
  ticks.forEach(t => {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css(t === 0 ? "--muted" : "--grid") }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, t));
  });
  bars.forEach((b, i) => {
    const x = m.l + band * i + (band - bw) / 2;
    const y1 = Y(Math.max(b.a, b.b) * 100), y2 = Y(Math.min(b.a, b.b) * 100);
    const rect = svgEl("rect", { x, y: y1, width: bw, height: Math.max(1.5, y2 - y1), rx: 3, fill: css(b.token) });
    hover(rect, [b.name, `${wp(b.v)} win-pts`].concat(b.total ? [] : [`Running total: ${wp(b.b)}`]));
    svg.append(rect);
    if (i < bars.length - 1 && !b.total)
      svg.append(svgEl("line", { x1: x + bw, x2: x + band, y1: Y(b.b * 100), y2: Y(b.b * 100), stroke: css("--muted"), "stroke-dasharray": "2 2" }));
    svg.append(svgEl("text", { x: x + bw / 2, y: b.v >= -0.005 ? y1 - 4 : y2 + 12, "text-anchor": "middle", fill: css("--text"),
                               "font-weight": b.total ? 700 : 400 }, wp(b.v)));
    svg.append(svgEl("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle" }, b.name));
  });
  if (price != null) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(price * 100), y2: Y(price * 100), stroke: css("--text"), "stroke-dasharray": "5 4" }));
  }
  const wrap = el("div");
  wrap.append(svg);
  const legend = el("div", { class: "legend" });
  legend.append(key("--blue", "This week"), key("--orange", "Weeks ahead"), key("--aqua", "Later"));
  if (price != null) legend.append(el("span", {}, `- - - an add costs ${Math.round(price * 100)}`));
  wrap.append(legend);
  return wrap;
}
function moveSheet(moveKey) {
  const r = data.moves.find(x => x.key === moveKey);
  if (!r) return null;
  const h = data.header, out = [];
  const title = el("h2", {}, r.drop ? `Add ${r.add.name}, drop ${r.drop.name}` : r.ir_slot ? `Add ${r.add.name} to ${r.ir_slot}` : `Add ${r.add.name} (open spot)`);
  title.append(el("span", { class: "chip" + (r.status === "plan" ? " plan" : "") }, STATUS[r.status] || r.status));
  const planned = (data.plan || []).find(q => q.key === r.key);
  out.push(title, el("div", { class: "note" }, planned ? `${planned.day}: ${planned.detail}` : r.why));
  out.push(el("h3", {}, "What it's worth, in win-pts"));
  out.push(waterfall(r));
  out.push(el("div", { class: "note" }, "Win-pts: percentage points of a weekly win. Each week's points count by how close that matchup is; later points at a typical week's worth (win-pts a point, the Win column)."));
  out.push(el("h3", {}, "From points to win-pts"));
  const rows = [[`This week (${r.games} game${r.games === 1 ? "" : "s"} left)`, signed(r.week_pts),
                 `${pct(r.win[0])} → ${pct(r.win[1])}`, wp(r.now_wins)]];
  (h.ahead || []).forEach((w, k) => {
    const pts = (r.ahead_week_pts || [])[k], dw = (r.ahead_wins || [])[k] || 0;
    rows.push([`Week ${w.week}` + (w.opponent ? ` vs ${w.opponent}` : " (opponent not known: a typical week)"),
               pts == null ? "" : signed(pts), w.win == null ? "" : `${pct(w.win)} → ${pct(w.win + dw)}`, wp(dw)]);
  });
  const lr = h.long_run || {};
  const laterName = r.held ? `Later (a streaming spot: only the ~${lr.hold_days ?? "?"} days he'd be held)`
    : lr.weeks ? `Later (${signed(r.later_pts / (lr.discount * lr.weeks))} a week × ${lr.weeks} weeks × ${lr.discount})` : "Later";
  rows.push([laterName, signed(r.later_pts), `× ${(100 * h.later_weight).toFixed(2)} each`, wp(r.later_wins)]);
  rows.push(["In all", "", h.price ? `the price: ${Math.round(100 * h.price.lam)}` : "", wp(r.value)]);
  out.push(kvTable(["", "Points", "Win", "Win-pts"], rows, true));
  const flags = [];
  if (r.when) flags.push(`Make it ${fmtDay(r.when)}.`);
  if (r.plays_from) flags.push(`On waivers: plays from ${fmtDay(r.plays_from)}.`);
  if (r.ir_slot) flags.push(`Goes straight into ${r.ir_slot}; once he's back, ${r.later_drop || "your cheapest player"} is dropped.`);
  if (r.until_back) flags.push(`Later points allow for ${r.until_back} coming back from IR: then the roster's cheapest player is cut.`);
  if (r.held) flags.push("Drops one of your streaming spots, which get swapped again within a few weeks.");
  if (flags.length) { const ul = el("ul", { class: "flags" }); flags.forEach(f => ul.append(el("li", {}, f))); out.push(ul); }
  const a = person(r.add.id), d = r.drop ? person(r.drop.id) : null;
  if (a) {
    const both = d && !!d.goalie === !!a.goalie;
    out.push(el("h3", {}, both ? `${a.goalie ? "A start" : "A game"}: ${lastName(a.name)} vs ${lastName(d.name)}` : `${lastName(a.name)}, ${a.goalie ? "a start" : "a game"}`));
    out.push(perGameBars(both ? [a, d] : [a], ["--blue", "--orange"]));
    if (both) {
      const legend = el("div", { class: "legend" });
      legend.append(key("--blue", `${a.name} (add)`), key("--orange", `${d.name} (drop)`));
      out.push(legend);
      if (!a.goalie)
        out.push(kvTable(["", lastName(a.name), lastName(d.name)], [
          ["Ice time (PP)", `${f1(a.toi)} (${f1(a.pp_toi)})`, `${f1(d.toi)} (${f1(d.pp_toi)})`],
          ["Games this season", String(a.gp), String(d.gp)],
          ["Tonight", pct(a.play) + (a.note ? ` ${a.note}` : ""), pct(d.play) + (d.note ? ` ${d.note}` : "")],
          ["Games projected", pct(a.durability), pct(d.durability)],
          ["Long-run points kept", pct(a.kept), pct(d.kept)],
        ]));
    }
    const btns = el("div");
    [a, d].filter(Boolean).forEach(p => {
      const b = el("button", { class: "linkish", type: "button" }, `${p.name} →`);
      b.onclick = () => openSheet("player", p.id);
      btns.append(b);
    });
    out.push(btns);
  }
  return out;
}

// One card that can't be drawn (data from another version of the page, a bug)
// says so in its place; the rest of the page still shows.
function safe(build) {
  try { return build(); } catch (e) {
    console.error(build.name, e);
    const card = el("section", { class: "card" });
    card.append(el("div", { class: "note" }, `This part couldn't be drawn (${build.name}: ${e.message}).`));
    return card;
  }
}
function message(text) { app.replaceChildren(el("p", { class: "empty" }, text)); }
function render() {
  if (!data) return;
  if (!data.header || !data.plan) {  // the data is an older version's (a deploy in progress)
    message("The dashboard is updating. Reopen it in a minute.");
    document.body.dataset.ready = "1";
    return;
  }
  if (CARD) {
    document.body.classList.add("card-mode");
    app.replaceChildren(...[header, planCard, weeksCard, nightsCard].map(safe));
  } else {
    app.replaceChildren(...[header, planCard, whyCard, playersCard, statsCard, weeksCard, nightsCard,
                            valueCard, grid, moveTable, budgetCard].map(safe).filter(Boolean));
    drawSheet();
  }
  document.body.dataset.ready = "1";  // notify/snapshot.py waits for this
}

try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
if (CARD) document.documentElement.dataset.theme = "light";
(window.__DATA__ ? Promise.resolve(window.__DATA__)
  : fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(d => { data = d; render(); })
  .catch(e => message(e.message === "404" ? "No plan yet: send /week to the bot."
                                          : `The plan couldn't be loaded (${e.message}). Reopen the page to try again.`));
// Only a new width redraws: a phone's address bar showing or hiding fires resize on
// scroll, and a redraw would rebuild an open sheet back at its top.
let resizeTimer, lastWidth = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastWidth) return;
  lastWidth = innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
