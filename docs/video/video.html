<!doctype html>
<html><head><meta charset="utf-8">
<title>Assistant GM in two minutes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=block">
<style>
:root{--surface:#0B1422;--card:#13213A;--tile:#182A47;--grid:#1E2E48;--text:#fff;--text2:#B7C2D3;--muted:#6B7A90;
  --blue:#4D9BF0;--blueInk:#7DB8FF;--orange:#F07A45;--orangeInk:#FFA57D;--aqua:#2CC28B;--blueSoft:#22508A;--kept:#5A3A2A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface);width:540px;height:960px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--surface)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38}
.head{position:absolute;left:36px;right:36px;font-family:'Inter Display',Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.08}
.head .w{display:inline-block;margin-right:.24em;will-change:transform}
.head .a{color:var(--aqua)}
.head .o{color:var(--orangeInk)}
.head .b{color:var(--blueInk)}
.tag{position:absolute;left:36px;top:62px;padding:7px 14px;border:2px solid var(--aqua);border-radius:30px;color:var(--aqua);
  font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.14em;transform-origin:0 50%}
.scene{position:absolute;inset:0}
.phone{position:absolute;width:290px;height:580px;left:125px;top:330px;border-radius:44px;background:#0E1A2E;
  border:3px solid #2A3E62;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 6px #0B1422;overflow:hidden}
.phone .notch{position:absolute;left:50%;top:10px;width:90px;height:22px;margin-left:-45px;border-radius:12px;background:#05090F}
.tghead{position:absolute;left:0;right:0;top:0;height:78px;background:#13213A;display:flex;align-items:flex-end;padding:0 16px 10px;gap:10px;border-bottom:1px solid var(--grid)}
.ava{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3b57,#05090F);border:2px solid var(--aqua);
  display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:15px;color:var(--aqua)}
.tgname{font-weight:700;font-size:15px}.tgname small{display:block;font-weight:500;font-size:12px;color:var(--text2)}
.tgcard{position:absolute;left:12px;right:12px;background:var(--tile);border-radius:16px;padding:14px 14px 12px;border:1px solid #24395E}
.day{font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--aqua)}
.mv{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-top:6px}
.badge{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;line-height:1;flex:none}
.badge.add{background:var(--aqua);color:#06281c}.badge.drop{background:#3A4A63;color:#fff}
.btns{display:flex;gap:6px;margin-top:12px}
.btn{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:#22365A;font-weight:700;font-size:13px;color:var(--text2)}
.chip{position:absolute;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid #2A3E62;font-weight:700;font-size:18px;white-space:nowrap}
.chip b{font-family:'Barlow Condensed';font-size:22px;color:var(--aqua);margin-left:6px}
.pl{position:absolute;width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#5AA8FF,#2F6FC0);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:800;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.18)}
.pl.g{background:linear-gradient(160deg,#5ee0b0,#1f9a6c)}
.float{position:absolute;font-family:'Barlow Condensed';font-weight:800;font-size:28px;color:var(--aqua);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.dot{position:absolute;border-radius:50%}
.tok{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--aqua);display:flex;align-items:center;justify-content:center;color:#06281c;font-weight:900;font-size:20px}
.wk{position:absolute;left:36px;right:36px;height:140px;border-radius:20px;background:var(--card);border:1px solid #24395E;padding:16px 20px}
.wk .t{font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:.1em;color:var(--text2)}
.wk .v{font-weight:600;font-size:17px;color:var(--orangeInk);margin-top:2px}
.wk .p{position:absolute;right:22px;top:24px;font-size:64px;line-height:1}
.wk .tr{position:absolute;left:20px;right:20px;bottom:18px;height:12px;border-radius:6px;background:#0B1422;overflow:hidden}
.wk .fi{height:100%;width:0;background:var(--blue);border-radius:6px}
.tile{position:absolute;width:26px;height:26px;border-radius:6px;background:#22365A}
.bar{position:absolute;bottom:0;border-radius:12px 12px 4px 4px}
.lab{position:absolute;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.08em;color:var(--text2);text-align:center}
.bubble{position:absolute;border-radius:16px;padding:10px 12px;font-size:14px;font-weight:600}
.conf{position:absolute;width:10px;height:14px;border-radius:2px}
.ray{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,rgba(44,194,139,.0),rgba(44,194,139,.35),rgba(44,194,139,0) 12%,rgba(77,155,240,.3) 25%,rgba(44,194,139,0) 37%,rgba(44,194,139,.3) 50%,rgba(44,194,139,0) 62%,rgba(77,155,240,.3) 75%,rgba(44,194,139,0) 87%,rgba(44,194,139,.35));filter:blur(4px)}
.logo{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3b57,#05090F 70%);border:6px solid var(--aqua);
  display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;color:#fff;box-shadow:0 0 60px rgba(44,194,139,.45)}
.slam{position:absolute;left:0;right:0;text-align:center;font-family:'Barlow Condensed';font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
#prog{position:absolute;left:0;bottom:0;height:5px;width:540px;background:linear-gradient(90deg,var(--blue),var(--aqua));transform-origin:0 50%}
</style></head>
<body>
<div id="stage"><div id="cam">
  <div class="blob" id="blob1" style="width:420px;height:420px;left:-140px;top:-80px;background:#22508A"></div>
  <div class="blob" id="blob2" style="width:380px;height:380px;right:-160px;bottom:40px;background:#1a6f55"></div>
  <svg class="abs" id="rink" width="540" height="960" style="left:0;top:0;opacity:.13">
    <circle cx="270" cy="560" r="150" fill="none" stroke="#7DB8FF" stroke-width="3"/>
    <circle cx="270" cy="560" r="6" fill="#7DB8FF"/>
    <line x1="0" y1="560" x2="540" y2="560" stroke="#F07A45" stroke-width="4"/>
    <line x1="0" y1="330" x2="540" y2="330" stroke="#4D9BF0" stroke-width="6"/>
    <line x1="0" y1="790" x2="540" y2="790" stroke="#4D9BF0" stroke-width="6"/>
  </svg>
  <div id="layer"></div>
</div>
<div id="prog"></div>
</div>
<!-- GSAP: a local copy (gsap.min.js, gitignored) when the network blocks the CDN, else cdnjs -->
<script src="gsap.min.js"></script>
<script>window.gsap || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"><\/script>')</script>
<script>
const T = 120;
const tl = gsap.timeline({paused: true, defaults: {ease: 'power3.out'}});
const L = document.getElementById('layer');
const cam = document.getElementById('cam');

// --- helpers ---------------------------------------------------------------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(cls, parent = L, html = '', style = {}) {
  const e = document.createElement('div'); e.className = cls; e.innerHTML = html;
  Object.assign(e.style, style); parent.appendChild(e); return e;
}
function scene() { const s = el('scene'); gsap.set(s, {autoAlpha: 0}); return s; }
function show(s, a, b) { tl.set(s, {autoAlpha: 1}, a); tl.set(s, {autoAlpha: 0}, b); }
// Headline: *word* = aqua, _word_ = orange, ~word~ = blue, | = line break.
function head(text, tIn, tOut, o = {}) {
  const h = el('head', o.parent || L, '', {top: (o.top ?? 118) + 'px', fontSize: (o.size ?? 40) + 'px', textAlign: o.align || 'left'});
  let cls = '';
  const words = [];
  for (let tok of text.split(' ')) {
    if (tok === '|') { h.appendChild(document.createElement('br')); continue; }
    let c = cls;
    for (const [m, k] of [['*', 'a'], ['_', 'o'], ['~', 'b']]) {
      if (tok.startsWith(m)) { tok = tok.slice(1); cls = k; c = k; }
      if (tok.endsWith(m) || tok.endsWith(m + '.') || tok.endsWith(m + ',') || tok.endsWith(m + ':') || tok.endsWith(m + '?')) {
        tok = tok.replace(m, ''); c = cls || k; cls = '';
      }
    }
    const w = el('w' + (c ? ' ' + c : ''), h, tok); words.push(w);
  }
  tl.fromTo(words, {y: 40, opacity: 0, rotation: 4, scale: .92}, {y: 0, opacity: 1, rotation: 0, scale: 1, duration: .7, stagger: .07, ease: 'back.out(1.7)'}, tIn);
  const acc = words.filter(w => w.classList.length > 1);
  if (acc.length) tl.fromTo(acc, {y: 0}, {y: -7, duration: .18, yoyo: true, repeat: 1, stagger: .05, ease: 'sine.inOut'}, tIn + .35 + words.length * .07);
  if (tOut != null) tl.to(words, {y: -34, opacity: 0, duration: .3, stagger: .02, ease: 'power2.in'}, tOut - .35);
  return h;
}
function tag(text, tIn, tOut) {
  const t = el('tag', L, text); gsap.set(t, {autoAlpha: 0});
  tl.fromTo(t, {autoAlpha: 0, scaleX: 0}, {autoAlpha: 1, scaleX: 1, duration: .45, ease: 'expo.out'}, tIn);
  tl.to(t, {autoAlpha: 0, x: -30, duration: .3, ease: 'power2.in'}, tOut - .3);
}
function count(e, a, b, t, d, o = {}) {
  const p = {v: a}, dec = o.dec ?? 0, suf = o.suf ?? '', pre = o.pre ?? '';
  e.textContent = pre + a.toFixed(dec) + suf;
  tl.fromTo(p, {v: a}, {v: b, duration: d, ease: o.ease || 'power2.out', onUpdate: () => e.textContent = pre + p.v.toFixed(dec) + suf}, t);
}
function shake(t, amp = 8, n = 6) {
  tl.fromTo(cam, {x: 0, y: 0}, {keyframes: Array.from({length: n}, (_, i) => ({x: (i % 2 ? -1 : 1) * amp * (1 - i / n), y: (i % 3 - 1) * amp * .5 * (1 - i / n), duration: .04})).concat([{x: 0, y: 0, duration: .04}]), ease: 'none'}, t);
}
function confetti(parent, x, y, t, n = 22, seed = 1) {
  const r = rng(seed), cols = ['#2CC28B', '#4D9BF0', '#FFFFFF', '#7DB8FF', '#FFA57D'];
  for (let i = 0; i < n; i++) {
    const c = el('conf', parent, '', {left: x + 'px', top: y + 'px', background: cols[i % cols.length]});
    gsap.set(c, {autoAlpha: 0});
    const ang = r() * Math.PI * 2, dist = 70 + r() * 150;
    tl.fromTo(c, {autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1},
      {x: Math.cos(ang) * dist, y: Math.sin(ang) * dist + 60, rotation: r() * 720 - 360, duration: 1.1 + r() * .5, ease: 'power3.out', immediateRender: false}, t);
    tl.to(c, {autoAlpha: 0, duration: .3}, t + 1.0 + r() * .4);
  }
}
function puck(t, y = 520) {
  const p = el('abs', L, '', {left: '-80px', top: y + 'px', width: '46px', height: '18px', borderRadius: '50%', background: '#05090F',
    boxShadow: '-60px 0 30px 6px rgba(44,194,139,.55), -150px 0 40px 4px rgba(77,155,240,.3)'});
  gsap.set(p, {autoAlpha: 0});
  tl.fromTo(p, {autoAlpha: 1, x: 0}, {x: 720, duration: .45, ease: 'power1.in', immediateRender: false}, t);
  tl.set(p, {autoAlpha: 0}, t + .46);
}
function phone(parent, title = 'Assistant GM', sub = 'bot') {
  const ph = el('phone', parent);
  el('tghead', ph, `<div class="ava">GM</div><div class="tgname">${title}<small>${sub}</small></div>`);
  el('notch', ph);
  return ph;
}

// --- background drift, progress -------------------------------------------
tl.fromTo('#blob1', {x: 0, y: 0}, {x: 260, y: 520, duration: T, ease: 'sine.inOut'}, 0);
tl.fromTo('#blob2', {x: 0, y: 0}, {x: -240, y: -560, duration: T, ease: 'sine.inOut'}, 0);
tl.fromTo('#rink', {rotation: 0, transformOrigin: '50% 58%'}, {rotation: 8, duration: T, ease: 'none'}, 0);
tl.fromTo('#prog', {scaleX: 0}, {scaleX: 1, duration: T, ease: 'none'}, 0);

// === S1 Hook (0-10) =========================================================
{
  const s = scene(); show(s, 0, 10.1);
  const ph = phone(s);
  const card = el('tgcard', ph, `<div class="day">THU 22 OCT · TODAY</div>
    <div class="mv"><span class="badge add">+</span>Martin Pospisil</div>
    <div class="mv" style="color:var(--text2)"><span class="badge drop">−</span>Leevi Meriläinen</div>
    <div style="margin-top:12px;font-size:14px;color:var(--text2)">Chance to win this week</div>
    <div class="num" style="font-size:44px;line-height:1"><span style="color:var(--text2)">45%</span> <span style="color:var(--muted)">→</span> <span id="s1p" style="color:var(--aqua)">45%</span></div>
    <div class="btns"><div class="btn">Done</div><div class="btn">Taken</div><div class="btn">Skip</div></div>`, {top: '96px'});
  tl.fromTo(ph, {y: 700}, {y: 0, duration: 1.2, ease: 'back.out(1.2)'}, .2);
  tl.fromTo(card, {y: -140, opacity: 0}, {y: 0, opacity: 1, duration: 1.0, ease: 'bounce.out'}, 1.6);
  tl.fromTo(ph, {rotation: 0}, {rotation: 2, duration: .06, yoyo: true, repeat: 7, ease: 'none'}, 1.6);
  count(document.getElementById('s1p'), 45, 47, 3.0, 1.2, {suf: '%'});
  tl.fromTo('#s1p', {scale: 1}, {scale: 1.2, duration: .25, yoyo: true, repeat: 1}, 4.2);
  head('Every week, your phone gets *one message.*', .6, 5.2);
  head('It names the *one move* that best raises your chance to win.', 5.4, 10.0);
  tl.to(ph, {y: 900, duration: .7, ease: 'power3.in'}, 9.4);
  puck(9.7, 560);
}

// === S2 Fantasy hockey 101 (10-28) ==========================================
{
  const s = scene(); show(s, 10.1, 28.2);
  tag('FANTASY HOCKEY 101', 10.3, 27.8);
  head('You manage a team of *real NHL players.*', 10.5, 15.0);
  const pos = [['LW', 105, 340], ['C', 239, 330], ['RW', 373, 340], ['LW', 105, 430], ['C', 239, 420], ['RW', 373, 430],
               ['D', 60, 525], ['D', 172, 535], ['D', 306, 535], ['D', 418, 525], ['G', 172, 625], ['G', 306, 625]];
  const pls = pos.map(([p, x, y]) => el('pl' + (p === 'G' ? ' g' : ''), s, p, {left: x + 'px', top: y + 'px'}));
  tl.fromTo(pls, {scale: 0}, {scale: 1, duration: .6, stagger: .12, ease: 'back.out(2.2)'}, 11.0);
  head('When they play, you score *points:* goals, shots, hits, blocks…', 15.2, 20.6);
  const chips = [['Goal', '+4', 60, 740], ['Shot', '+0.5', 290, 740], ['Hit', '+0.6', 60, 810], ['Block', '+0.8', 290, 810]];
  const ch = chips.map(([n, v, x, y]) => el('chip', s, `${n}<b>${v}</b>`, {left: x + 'px', top: y + 'px', fontSize: '22px'}));
  tl.fromTo(ch, {scale: 0, opacity: 0}, {scale: 1, opacity: 1, duration: .5, stagger: .35, ease: 'back.out(2)'}, 16.2);
  const r = rng(7), vals = ['+4', '+0.5', '+0.6', '+0.8'];
  for (let i = 0; i < 12; i++) {
    const k = Math.floor(r() * 12), [p, x, y] = pos[k];
    const f = el('float', s, vals[i % 4], {left: (x + 14) + 'px', top: (y - 6) + 'px'});
    gsap.set(f, {autoAlpha: 0});
    const t = 16.4 + i * .32;
    tl.fromTo(f, {autoAlpha: 1, y: 0, scale: .7}, {y: -60, scale: 1, duration: 1.0, ease: 'power2.out', immediateRender: false}, t);
    tl.to(f, {autoAlpha: 0, duration: .3}, t + .8);
    tl.fromTo(pls[k], {scale: 1}, {scale: 1.15, duration: .15, yoyo: true, repeat: 1}, t);
  }
  tl.to(ch, {scale: 0, opacity: 0, duration: .35, stagger: .05, ease: 'back.in(2)'}, 20.3);
  tl.to(pls, {scale: 0, duration: .35, stagger: .02, ease: 'back.in(2)'}, 20.3);
  head('Each week you face *one* *rival*. More points wins the week.', 20.9, 27.9);
  const mk = (x, blue, name) => {
    const wrap = el('abs', s, '', {left: x + 'px', top: '330px', width: '200px', height: '540px'});
    el('lab', wrap, name, {left: 0, right: 0, top: '0px', fontSize: '24px', color: blue ? 'var(--blueInk)' : 'var(--orangeInk)'});
    const n = el('num', wrap, '0', {position: 'absolute', left: 0, right: 0, top: '30px', textAlign: 'center', fontSize: '80px', lineHeight: 1});
    const tr = el('abs', wrap, '', {left: '40px', width: '120px', top: '130px', height: '400px'});
    const b = el('bar', tr, '', {left: 0, right: 0, height: '400px', transformOrigin: '50% 100%',
      background: blue ? 'linear-gradient(0deg,#22508A,#4D9BF0)' : 'linear-gradient(0deg,#7A3A1E,#F07A45)'});
    return {wrap, b, n};
  };
  const you = mk(40, true, 'YOU'), them = mk(300, false, 'PUCK BANDITS');
  tl.fromTo([you.wrap, them.wrap], {opacity: 0, y: 50}, {opacity: 1, y: 0, duration: .6, stagger: .15}, 21.6);
  tl.fromTo(you.b, {scaleY: 0}, {scaleY: .97, duration: 4, ease: 'power2.in'}, 22.4);
  tl.fromTo(them.b, {scaleY: 0}, {scaleY: .9, duration: 4, ease: 'power2.out'}, 22.4);
  count(you.n, 0, 212, 22.4, 4, {ease: 'power2.in'});
  count(them.n, 0, 197, 22.4, 4, {ease: 'power2.out'});
  const vs = el('abs', s, 'VS', {left: '230px', top: '540px', width: '80px', height: '80px', borderRadius: '50%', background: '#fff', color: '#0B1422',
    display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Barlow Condensed', fontWeight: 800, fontSize: '36px'});
  tl.fromTo(vs, {scale: 3, opacity: 0}, {scale: 1, opacity: 1, duration: .5, ease: 'expo.out'}, 21.9);
  const win = el('abs', s, 'WIN', {left: '62px', top: '590px', padding: '6px 18px', border: '5px solid var(--aqua)', borderRadius: '12px', color: 'var(--aqua)',
    fontFamily: 'Barlow Condensed', fontWeight: 800, fontSize: '64px', lineHeight: 1, background: 'rgba(11,20,34,.75)'});
  tl.fromTo(win, {scale: 3, opacity: 0, rotation: 10}, {scale: 1, opacity: 1, rotation: -10, duration: .4, ease: 'expo.out'}, 26.6);
  shake(26.8, 7, 5);
  confetti(s, 140, 590, 26.7, 18, 3);
  tl.to([you.wrap, them.wrap, vs, win], {opacity: 0, duration: .4}, 27.7);
}

// === S3 The hard part (28-42) ===============================================
{
  const s = scene(); show(s, 28.1, 42.1);
  tag('THE HARD PART', 28.3, 41.8);
  head('You can swap in *free agents:* hundreds are out there…', 28.5, 33.6);
  const r = rng(11), N = 140, dots = [];
  for (let i = 0; i < N; i++) {
    const sz = 8 + r() * 9;
    const d = el('dot', s, '', {left: '270px', top: '600px', width: sz + 'px', height: sz + 'px',
      background: ['#7DB8FF', '#B7C2D3', '#4D9BF0', '#6B7A90', '#2CC28B'][Math.floor(r() * 5)]});
    gsap.set(d, {autoAlpha: 0});
    dots.push({d, x: (r() - .5) * 470, y: (r() - .5) * 500, dx: (r() - .5) * 50, dy: (r() - .5) * 50});
  }
  dots.forEach((o, i) => {
    tl.fromTo(o.d, {autoAlpha: 0, x: 0, y: 0, scale: 0}, {autoAlpha: 1, x: o.x, y: o.y, scale: 1, duration: 1.6, ease: 'expo.out'}, 29.0 + (i % 40) * .03);
    tl.to(o.d, {x: o.x + o.dx, y: o.y + o.dy, duration: 3.5, ease: 'sine.inOut'}, 30.6);
  });
  head('…but only *36 swaps* for the whole season.', 33.8, 38.6);
  for (let i = 0; i < 36; i++) {
    const gx = (i % 6) * 62 - 155, gy = Math.floor(i / 6) * 62 - 190;
    tl.to(dots[i].d, {x: gx + 5, y: gy + 20, width: 44, height: 44, background: '#2CC28B', duration: 1.1, ease: 'back.out(1.4)'}, 34.2 + i * .015);
  }
  tl.to(dots.slice(36).map(o => o.d), {scale: 0, opacity: 0, duration: .6, stagger: .003, ease: 'power2.in'}, 34.1);
  const lbl = el('lab', s, '36 SWAPS · OCTOBER → APRIL', {left: 0, right: 0, top: '820px', fontSize: '26px', color: 'var(--aqua)'});
  tl.fromTo(lbl, {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: .5}, 35.4);

{
