name: Dashboard

# Publishes site/ to GitHub Pages when the page itself changes. The bot's own
# runs publish it when they rewrite data.json (assistant_gm.yml, deploy-dashboard),
# but a change to index.html alone used to wait for the next plan run: on
# 2026-10-09 the page served stayed the morning's for hours. The bot commits with
# the workflow token, which starts no push workflows, so this runs only for
# pushes by people (and on demand).
on:
  push:
    branches: [main]
    paths: [site/index.html, site/manifest.webmanifest, 'site/icon-*.png']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages looks the artifact up the moment upload-pages-artifact has
      # finalized it, and GitHub's API can take a few seconds to list it: "Found 0
      # artifact(s)", "No artifacts named github-pages", 17 of the 18 red runs Nov 10-25.
      # Nothing had gone wrong but the timing, so a miss waits and tries again.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for the artifact to be listed
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait longer
        if: steps.deploy_again.outcome == 'failure'
        run: sleep 60
      - id: deploy_last
        if: steps.deploy_again.outcome == 'failure'
        uses: actions/deploy-pages@v4
