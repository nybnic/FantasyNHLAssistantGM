name: Assistant GM

on:
  schedule:
    # Every 30 min, 09:00-21:30 UTC = 12:00-00:30 Helsinki in summer time,
    # 11:00-23:30 in winter. main.py itself decides when a briefing is due
    # and keeps quiet 23:00-08:00 local. GitHub may start runs a few minutes late.
    - cron: "*/30 9-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: assistant-gm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The job's clock can start while it still waits for a runner: on
    # 2026-10-05 GitHub took 5-10 min to start runs, and two never got one
    # within 15 and were cancelled. The job limit leaves room for that wait;
    # the bot's own step has the tight limit, for a run that hangs.
    timeout-minutes: 30
    outputs:
      dashboard: ${{ steps.dashboard.outputs.changed }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional webhook relay (relay/): the relay also starts this workflow
      # right after each Telegram message, for replies in about half a minute.
      RELAY_URL: ${{ secrets.RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      # The private data repo's deploy key exists (the key itself stays in its step).
      HAS_ARCHIVE: ${{ secrets.ARCHIVE_DEPLOY_KEY != '' }}
    steps:
      # The latest main, not the commit this run was queued on: runs started
      # seconds apart (e.g. by two quick Telegram messages) must each see the
      # state the previous run pushed, or they handle the same taps twice.
      - uses: actions/checkout@v4
        with:
          ref: main

      # DFO line charts are third-party data: archived in a private repo
      # (bot/dfo_archive.py), never here. Its failure mustn't stop the run.
      - name: Check out the private data archive
        if: env.HAS_ARCHIVE == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: nybnic/FantasyNHLAssistantGM-data
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: archive

      # A deploy key can be read-only: then the checkout works but every push
      # fails, quietly (that step can't stop the run). A dry-run push asks
      # GitHub for write access without changing anything; main.py reports a "no".
      - name: Can the bot push to the data archive?
        id: archive_push
        if: env.HAS_ARCHIVE == 'true'
        continue-on-error: true
        run: |
          [ -d archive/.git ] || exit 1
          cd archive
          git push --dry-run origin "HEAD:refs/heads/$(git branch --show-current)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The Telegram card is the dashboard rendered by headless Chromium
      # (notify/snapshot.py). Cached between runs; if the install fails, the
      # plan goes out with the old matplotlib chart instead, so it can't stop the run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - name: Install the headless browser
        continue-on-error: true
        timeout-minutes: 4
        run: python -m playwright install --with-deps --only-shell chromium

      # Past seasons' NHL stats never change: keep them between runs instead
      # of re-downloading ~140k rows every time.
      - uses: actions/cache@v4
        with:
          path: data/cache/gm
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Note the dashboard data before the run
        id: before
        run: echo "hash=$(sha256sum site/data.json 2>/dev/null | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Run Assistant GM
        # Until the Telegram secrets exist there's nothing to send: skip quietly.
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        timeout-minutes: 12
        env:
          ARCHIVE_WRITABLE: ${{ steps.archive_push.outcome == 'success' }}
        run: python main.py

      - name: Commit roster and state
        if: always()
        run: |
          git config user.name "assistant-gm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ site/
          if ! git diff --cached --quiet; then
            git commit -m "Assistant GM: update roster and state"
            git pull --rebase
            git push
          fi

      - name: Push the data archive
        if: always() && env.HAS_ARCHIVE == 'true'
        continue-on-error: true
        run: |
          [ -d archive/.git ] || exit 0
          cd archive
          git config user.name "assistant-gm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Data archive: DFO line charts, Yahoo matchup rows, screenshots"
            git pull --rebase
            git push
          fi

      # The weekly plan rewrites site/data.json; publish only when it changed.
      - name: Did the dashboard change?
        id: dashboard
        if: always()
        run: |
          after=$(sha256sum site/data.json 2>/dev/null | cut -c1-64)
          echo "changed=$([ -n "$after" ] && [ "$after" != "${{ steps.before.outputs.hash }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Screenshots are rare, so the OCR is only loaded when one arrives. Load
      # it here too (after the bot's work is done), so a broken install shows
      # up as a red run rather than on the next screenshot.
      - name: Check the screenshot OCR loads
        run: python -c "from clients.screenshot import _ocr; _ocr()"

  # The dashboard (site/index.html + data.json) on GitHub Pages. Needs Pages
  # enabled with "GitHub Actions" as its source (docs/operations.md).
  deploy-dashboard:
    needs: run
    if: needs.run.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    # One Pages deploy at a time, with dashboard.yml's (a change to the page itself).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
