name: Check

# Read-only runs on demand, for checking a change against live data where a
# development sandbox has no network: a dry run, explain_week, backtests.
# Sends nothing, commits nothing, and gets no secrets. Its log is public like
# the repo: it shows what the dashboard and state/ already show.
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - dry-run
          - explain-week
          - trade-suggestions
          - trade-scan
          - backtest
          - check-sigma
          - check-sigma-nights
          - check-form
          - venue-backtest
          - retro-forecast
          - schedule
          - replay
          - replay-audit
          - goalie-absence
          - injury-sources
          - goalie-shares
          - goalie-form
          - third-goalie
          - depth
          - trade
          - scoreboard
      now:
        description: Optional ISO time for --now (dry-run, explain-week), e.g. 2026-10-05T12:30:00+03:00
        type: string
        required: false
      players:
        description: Optional free agents for explain-week to score too (then every move is listed), comma-separated, e.g. Jack Quinn, Quinton Byfield; for trade the trade, e.g. Shane Pinto for Lucas Raymond
        type: string
        required: false
      ir:
        description: Optional players of mine for explain-week to treat as on IR+ (moved in Yahoo, bot not told yet), comma-separated
        type: string
        required: false
      weeks:
        description: Optional fantasy weeks for schedule, space-separated, e.g. 24 25 26 (default this week and next); for depth the first and last (default now to week 26); for replay-audit the leagues' seed (default 11)
        type: string
        required: false
      moves:
        description: Optional moves for depth to weigh, OUT > IN, comma-separated, scenarios separated by |, e.g. Shane Pinto > Lucas Raymond | Shane Pinto > Leevi Merilainen; for trade-scan MINE > TEAM, e.g. Steven Stamkos > Bottom three
        type: string
        required: false
      variants:
        description: Optional replay variants, comma-separated, e.g. exit, exit charged (the reference is always run; default all)
        type: string
        required: false
      leagues:
        description: Optional number of replay leagues (default 8)
        type: string
        required: false
      price:
        description: Optional replay add price for every variant (0 = spend at the budget's pace)
        type: string
        required: false
      reference:
        description: Optional replay variant the others are compared with (default keeper add), e.g. live price
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The branch the run was started on (main by default), so a change can be
      # checked against live data before it's merged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The bot's NHL data cache, read only: this job never saves it.
      - uses: actions/cache/restore@v4
        with:
          path: data/cache/gm
          key: nhl-data-check
          restore-keys: nhl-data-

      - name: Run
        env:
          COMMAND: ${{ inputs.command }}
          NOW: ${{ inputs.now }}
          PLAYERS: ${{ inputs.players }}
          IR: ${{ inputs.ir }}
          WEEKS: ${{ inputs.weeks }}
          MOVES: ${{ inputs.moves }}
          VARIANTS: ${{ inputs.variants }}
          LEAGUES: ${{ inputs.leagues }}
          PRICE: ${{ inputs.price }}
          REFERENCE: ${{ inputs.reference }}
        run: |
          if [ -n "$NOW" ] && ! [[ "$NOW" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+([+-][0-9:]+)?$ ]]; then
            echo "now must be an ISO time like 2026-10-05T12:30:00+03:00"; exit 1
          fi
          if ! [[ "$PLAYERS$IR" =~ ^[[:alpha:][:space:].,\'-]*$ ]]; then
            echo "players and ir must be names separated by commas"; exit 1
          fi
          if ! [[ "$MOVES" =~ ^[[:alpha:][:space:].,\'\>\|-]*$ ]]; then
            echo "moves must be OUT > IN pairs separated by commas, scenarios by |"; exit 1
          fi
          if ! [[ "$WEEKS" =~ ^[0-9[:space:]]*$ ]]; then
            echo "weeks must be week numbers separated by spaces"; exit 1
          fi
          if ! [[ "$VARIANTS" =~ ^[a-z0-9[:space:].,]*$ ]] || ! [[ "$LEAGUES" =~ ^[0-9]*$ ]] || ! [[ "$PRICE" =~ ^[0-9.]*$ ]]; then
            echo "variants must be names separated by commas, leagues and price numbers"; exit 1
          fi
          adds=()
          top=60
          [ -n "$PLAYERS" ] && top=1000
          IFS=',' read -ra names <<< "$PLAYERS"
          for n in "${names[@]}"; do
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            [ -n "$n" ] && adds+=(--add "$n")
          done
          IFS=',' read -ra names <<< "$IR"
          for n in "${names[@]}"; do
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            [ -n "$n" ] && adds+=(--ir "$n")
          done
          goalies=()
          IFS=',' read -ra names <<< "$PLAYERS"
          for n in "${names[@]}"; do
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            [ -n "$n" ] && goalies+=(--goalie "$n")
          done
          variants=()
          IFS=',' read -ra names <<< "$VARIANTS"
          for n in "${names[@]}"; do
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            [ -n "$n" ] && variants+=("$n")
          done
          case "$COMMAND" in
            dry-run) python main.py --dry-run --force ${NOW:+--now "$NOW"} ;;
            explain-week) python -m scripts.explain_week --top "$top" ${NOW:+--now "$NOW"} "${adds[@]}" ;;
            trade-suggestions) time python main.py --dry-run --trade ;;
            trade-scan) time python -m scripts.trade_scan --give "${MOVES%%>*}" --team "$(echo "${MOVES#*>}" | xargs)" ;;
            backtest) python -m scripts.backtest ;;
            check-sigma) python -m scripts.check_sigma ;;
            check-sigma-nights) for season in 20252026 20242025; do time python -m scripts.check_sigma --season "$season" --from-day 6 5 4 3 2 1 0 --leagues "${LEAGUES:-8}"; done ;;
            check-form) time python -m scripts.check_form ;;
            venue-backtest) python -m scripts.backtest_venue ;;
            retro-forecast) python -m scripts.retro_forecast ;;
            schedule) python -m scripts.schedule $WEEKS ;;
            goalie-absence) python -m scripts.fit_goalie_absence ;;
            injury-sources) python -m scripts.injury_sources ;;
            goalie-shares) python -m scripts.goalie_shares ;;
            goalie-form) time python -m scripts.fit_goalie_form ;;
            third-goalie) python -m scripts.third_goalie "${goalies[@]}" ;;
            depth) time python -m scripts.depth ${WEEKS:+--weeks "$WEEKS"} ${MOVES:+--try "$MOVES"} ;;
            trade) time python main.py --dry-run --trade "$PLAYERS" ;;
            scoreboard) python -m scripts.scorecard ;;
            replay) time python -m scripts.replay --leagues "${LEAGUES:-8}" --workers 4 ${PRICE:+--price "$PRICE"} ${REFERENCE:+--reference "$REFERENCE"} ${variants[@]:+--variants "${variants[@]}"} ;;
            replay-audit) time python -m scripts.replay --audit --seed "${WEEKS:-11}" --leagues "${LEAGUES:-8}" --workers 4 ${PRICE:+--price "$PRICE"} --reference "${REFERENCE:-pace 0.08 k2}" --variants "${variants[@]:-${REFERENCE:-pace 0.08 k2}}" ;;
          esac
